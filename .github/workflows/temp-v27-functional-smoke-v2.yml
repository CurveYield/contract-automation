name: Temporary V27 Functional Smoke v2

on:
  pull_request:
    paths:
      - 'github-native-sim/jobs/v27-functional-smoke-v2/**'
      - '.github/workflows/temp-v27-functional-smoke-v2.yml'

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RPC_ETHEREUM: ${{ secrets.RPC_ETHEREUM }}
    steps:
      - name: Check out merged suite and V27 job
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install trusted repository dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Reconstruct exact V27 packet sources
        run: |
          set -euo pipefail
          job_root='github-native-sim/jobs/v27-functional-smoke-v2'
          mkdir -p "$job_root/project"
          cat "$job_root"/source-payloads/archive/v27-sources.tar.gz.part-*.b64 > /tmp/v27-sources.tar.gz.b64
          base64 -d /tmp/v27-sources.tar.gz.b64 > /tmp/v27-sources.tar.gz
          echo '4ac83fac16a6005a9517775edc19f8997e2a6752f8ad94d2c7442eee0babbb59  /tmp/v27-sources.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v27-sources.tar.gz -C "$job_root/project"
          echo 'c3c009179c53a9b5953f090ab8fd47528e392044b65c73006d229eeed8dd69c2  github-native-sim/jobs/v27-functional-smoke-v2/project/CurveYieldSdYBHybridVaultV27.sol' | sha256sum -c -
          echo '8d5db62b021d152c48fde77cb426d22e1948a3208f169586cf91d07f0ad89a04  github-native-sim/jobs/v27-functional-smoke-v2/project/CurveYieldSdYBTwoDestinationStrategyV27.sol' | sha256sum -c -

      - name: Execute merged GitHub-native functional smoke
        id: execute
        continue-on-error: true
        run: >-
          node packages/github-native-sim/src/cli.mjs
          --job github-native-sim/jobs/v27-functional-smoke-v2/job.json
          --output "$RUNNER_TEMP/v27-functional-smoke-v2"

      - name: Upload functional smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CurveYield-V27-Functional-Smoke-v2
          path: ${{ runner.temp }}/v27-functional-smoke-v2
          if-no-files-found: error
          retention-days: 30

      - name: Propagate functional smoke result
        if: steps.execute.outcome == 'failure'
        run: exit 1
