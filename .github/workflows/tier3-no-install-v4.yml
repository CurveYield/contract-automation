name: Tier 3 No-Install Verification v4

on:
  push:
    branches:
      - audit-round5/tier3-controller-ui-v1
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tier3-no-install-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact feature-branch source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Verify no-install boundary
        id: boundary
        shell: bash
        run: |
          set -euo pipefail
          node --version
          test ! -d node_modules
          workflow=.github/workflows/tier3-no-install-v4.yml
          ! grep -Eq '^[[:space:]]*(npm[[:space:]]+(install|ci)|pnpm([[:space:]]|$)|yarn([[:space:]]|$)|npx([[:space:]]|$)|forge([[:space:]]|$)|hardhat([[:space:]]|$)|solc([[:space:]]|$)|wrangler([[:space:]]|$))' "$workflow"

      - name: Verify controller core and API adapters
        id: core
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            packages/protocol/test/tier3-controller-v1.test.mjs \
            apps/api/test/controller-adapter-v1.test.mjs \
            apps/api/test/controller-command-adapter-v1.test.mjs \
            apps/api/test/controller-entry-v1.test.mjs \
            packages/runner/test/audit-round5-tier3-controller-secret-v1.test.mjs \
            apps/web/test/tier3-client-v1.test.mjs

      - name: Verify controller summary presenter
        id: summary
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --test apps/web/test/controller-view-v1.test.mjs

      - name: Verify controller detail model
        id: detail_model
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --test apps/web/test/controller-detail-model-v1.test.mjs

      - name: Verify operator shell and detail surface
        id: detail_shell
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            apps/web/test/tier3-operator-shell-v1.test.mjs \
            apps/web/test/tier3-operator-detail-v1.test.mjs

      - name: Verify dependency-free legacy regressions
        id: legacy
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            apps/api/test/entry.test.mjs \
            apps/web/test/client.test.mjs

      - name: Verify JavaScript syntax
        id: syntax
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --check packages/protocol/src/tier3-controller-v1.mjs
          node --check apps/api/src/controller-adapter-v1.mjs
          node --check apps/api/src/controller-command-adapter-v1.mjs
          node --check apps/api/src/entry.mjs
          node --check apps/web/src/client.mjs
          node --check apps/web/src/controller-view-v1.mjs
          node --check apps/web/src/controller-view-v2.mjs
          node --check apps/web/src/controller-detail-model-v1.mjs
          node --check apps/web/public/app.js
          node --check scripts/build.mjs

      - name: Verify Pages-copy and safety invariants
        id: invariants
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          grep -F "client.mjs'), path.join(output, 'client.js')" scripts/build.mjs >/dev/null
          grep -F "controller-view-v2.mjs'), path.join(output, 'controller-view.js')" scripts/build.mjs >/dev/null
          grep -F "controller-detail-model-v1.mjs'), path.join(output, 'controller-detail-model-v1.mjs')" scripts/build.mjs >/dev/null
          grep -F 'AUDIT_CONTROLLER_INTAKE_ISSUE = "64"' apps/api/wrangler.toml >/dev/null
          ! grep -Eq 'innerHTML\s*=|insertAdjacentHTML' apps/web/public/app.js apps/web/src/controller-view-v2.mjs
          ! grep -Eq 'mailboxIssueNumber|AUDIT_CONTROLLER_INTAKE_ISSUE' apps/web/public/app.js
          ! grep -Eq 'issue-number|issueNumber' apps/web/public/index.html

      - name: Enforce diagnostic result
        id: enforce
        shell: bash
        env:
          CORE: ${{ steps.core.outcome }}
          SUMMARY: ${{ steps.summary.outcome }}
          DETAIL_MODEL: ${{ steps.detail_model.outcome }}
          DETAIL_SHELL: ${{ steps.detail_shell.outcome }}
          LEGACY: ${{ steps.legacy.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
          INVARIANTS: ${{ steps.invariants.outcome }}
        run: |
          set -euo pipefail
          for outcome in "$CORE" "$SUMMARY" "$DETAIL_MODEL" "$DETAIL_SHELL" "$LEGACY" "$SYNTAX" "$INVARIANTS"; do
            test "$outcome" = success
          done

      - name: Publish sanitized verification receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOUNDARY: ${{ steps.boundary.outcome }}
          CORE: ${{ steps.core.outcome }}
          SUMMARY: ${{ steps.summary.outcome }}
          DETAIL_MODEL: ${{ steps.detail_model.outcome }}
          DETAIL_SHELL: ${{ steps.detail_shell.outcome }}
          LEGACY: ${{ steps.legacy.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
          INVARIANTS: ${{ steps.invariants.outcome }}
          ENFORCE: ${{ steps.enforce.outcome }}
        run: |
          set -euo pipefail
          overall=PASS
          if [[ "$BOUNDARY" != success || "$ENFORCE" != success ]]; then overall=FAIL; fi
          receipt=$(cat <<EOF
          ## Tier 3 No-Install Verification v4

          - result: \`$overall\`
          - run: \`$GITHUB_RUN_ID\`
          - source SHA: \`$GITHUB_SHA\`
          - boundary: \`$BOUNDARY\`
          - controller/API core: \`$CORE\`
          - summary presenter: \`$SUMMARY\`
          - detail model: \`$DETAIL_MODEL\`
          - detail shell: \`$DETAIL_SHELL\`
          - legacy regressions: \`$LEGACY\`
          - JavaScript syntax: \`$SYNTAX\`
          - safety/static invariants: \`$INVARIANTS\`
          - dependency installation/download: \`NO\`
          - repository build: \`NO\`
          - Solidity compiler/toolchain: \`NO\`
          - Cloudflare deployment: \`NO\`
          - controller mailbox mutation: \`NO\`
          - wallet/signing/broadcast: \`NO\`
          EOF
          )
          gh issue comment 170 --repo "$GITHUB_REPOSITORY" --body "$receipt"
