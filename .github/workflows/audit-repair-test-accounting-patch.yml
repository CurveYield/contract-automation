name: Apply Audit Retention Accounting Test Patch Once

on:
  pull_request:
    paths:
      - ".github/workflows/audit-repair-test-accounting-patch.yml"

permissions:
  contents: write

concurrency:
  group: audit-retention-accounting-patch-once
  cancel-in-progress: true

jobs:
  patch:
    if: github.head_ref == 'audit-repair/phases-1-3-v1' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit-repair/phases-1-3-v1
          persist-credentials: true
      - name: Apply exact reviewed test replacements
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceExact(path, before, after) {
            const text = fs.readFileSync(path, 'utf8');
            if (!text.includes(before)) throw new Error(`Expected text not found in ${path}: ${before}`);
            fs.writeFileSync(path, text.replace(before, after));
          }

          replaceExact(
            'packages/audit-evidence/test/evidence.test.mjs',
            "assert.deepEqual(delta(store.usage(), before), { classA: 4, classB: 2, free: 0 });",
            "assert.deepEqual(delta(store.usage(), before), { classA: 4, classB: 2, free: 1 });"
          );
          replaceExact(
            'test/audit-repair-end-to-end.test.mjs',
            "assert.deepEqual(operationCounts(store.usage()), { classA: 43, classB: 29, free: 0 });",
            "assert.deepEqual(operationCounts(store.usage()), { classA: 43, classB: 29, free: 1 });"
          );
          replaceExact(
            'test/audit-infra.test.mjs',
            "  assert.equal(rules.get('jobs/'), 30);",
            "  assert.equal(rules.get('jobs/'), 30);\n  assert.equal(rules.get('job-logs/'), 7);\n  assert.equal(rules.get('job-artifacts/'), 7);"
          );
          NODE
      - name: Commit repaired accounting tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/audit-evidence/test/evidence.test.mjs test/audit-repair-end-to-end.test.mjs test/audit-infra.test.mjs
          git commit -m "test: align retention accounting and lifecycle assertions"
          git push origin "HEAD:audit-repair/phases-1-3-v1"
