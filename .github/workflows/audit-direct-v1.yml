name: GitHub Direct Audit v1

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Fixed GitHub Direct operation
        required: true
        type: choice
        options:
          - submit
          - status
          - cancel
          - report
          - capabilities
          - verify-fixture
      target_sha:
        description: Exact 40-character target commit SHA
        required: true
        type: string
      installation_id:
        description: GitHub App installation ID
        required: true
        type: string
      report_issue_number:
        description: Trusted issue receiving bounded comments
        required: true
        type: string

permissions:
  contents: write
  checks: write
  statuses: write
  issues: write
  actions: read

concurrency:
  group: audit-direct-v1-${{ github.repository_id }}-${{ inputs.target_sha }}
  cancel-in-progress: true

jobs:
  audit-direct:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted workflow implementation
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-runner
          persist-credentials: false

      - name: Validate bounded workflow inputs
        shell: bash
        env:
          AUDIT_OPERATION: ${{ inputs.operation }}
          TARGET_SHA: ${{ inputs.target_sha }}
          INSTALLATION_ID: ${{ inputs.installation_id }}
          REPORT_ISSUE_NUMBER: ${{ inputs.report_issue_number }}
        run: |
          set -euo pipefail
          case "$AUDIT_OPERATION" in
            submit|status|cancel|report|capabilities|verify-fixture) ;;
            *) exit 2 ;;
          esac
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$INSTALLATION_ID" =~ ^[1-9][0-9]*$ ]] || exit 2
          [[ "$REPORT_ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 2

      - name: Checkout target commit as inert data
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ inputs.target_sha }}
          path: target-source
          persist-credentials: false

      - name: Bind target checkout to exact input SHA
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git -C target-source rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$TARGET_SHA"
          TREE_SHA="$(git -C target-source rev-parse 'HEAD^{tree}')"
          COMMIT_EPOCH="$(git -C target-source show -s --format=%ct HEAD)"
          REQUESTED_AT="$(date -u -d "@$COMMIT_EPOCH" +%Y-%m-%dT%H:%M:%S.000Z)"
          git -C target-source ls-tree -r --name-only HEAD | sed -n '1,10000p' > target-file-index.txt
          printf 'DIRECT_REQUESTED_AT=%s\n' "$REQUESTED_AT" >> "$GITHUB_ENV"
          printf '{"schemaVersion":"github-direct-target-binding-v1","targetCommitSha":"%s","targetTreeSha":"%s","requestedAt":"%s"}\n' \
            "$ACTUAL_SHA" "$TREE_SHA" "$REQUESTED_AT" > target-binding.json

      - name: Run trusted GitHub Direct service
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_DIRECT_REPORT_ISSUE: ${{ inputs.report_issue_number }}
          AUDIT_OPERATION: ${{ inputs.operation }}
          TARGET_SHA: ${{ inputs.target_sha }}
          INSTALLATION_ID: ${{ inputs.installation_id }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY_FULL_NAME: ${{ github.repository }}
          REQUESTER_ID: actor-${{ github.actor_id }}
        run: |
          set -euo pipefail
          REQUESTED_AT="$DIRECT_REQUESTED_AT"
          COMMON=(
            --repository-id "$REPOSITORY_ID"
            --installation-id "$INSTALLATION_ID"
            --repository "$REPOSITORY_FULL_NAME"
            --requester "$REQUESTER_ID"
            --policy direct-policy-v1
            --profile hardhat-test-v1
            --parser hardhat-test-parser-v1
            --result-contract phase5-tool-result-v1
            --report-contract audit-report-v1
            --target-sha "$TARGET_SHA"
            --requested-at "$REQUESTED_AT"
            --idempotency-key "workflow-${REPOSITORY_ID}-${TARGET_SHA:0:12}-${REQUESTER_ID}"
            --at "$REQUESTED_AT"
          )
          RESULT_ID="result-${TARGET_SHA:0:12}"
          REPORT_ID="report-${TARGET_SHA:0:12}"
          case "$AUDIT_OPERATION" in
            submit)
              EXTRA=(--result-id "$RESULT_ID" --report-id "$REPORT_ID" --comment "GitHub Direct submission processed.")
              ;;
            report)
              EXTRA=(--result-id "$RESULT_ID" --report-id "$REPORT_ID" --comment "GitHub Direct report reconciled.")
              ;;
            cancel)
              EXTRA=(--reason workflow-cancelled)
              ;;
            verify-fixture)
              EXTRA=(--source-sha "$TARGET_SHA")
              ;;
            *)
              EXTRA=()
              ;;
          esac
          node trusted-runner/apps/audit-github-direct-cli/src/main.mjs "$AUDIT_OPERATION" "${COMMON[@]}" "${EXTRA[@]}" > audit-direct-output.json

      - name: Upload bounded machine result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit-direct-result
          path: |
            audit-direct-output.json
            target-binding.json
            target-file-index.txt
          if-no-files-found: warn
          retention-days: 1
