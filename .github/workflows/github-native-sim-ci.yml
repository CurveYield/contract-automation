name: Security-reconcile merged live-fork workflows and RPC health state
run-name: Security-reconcile merged live-fork workflows and RPC health state

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: v27-remote-anvil-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate-v27-contract-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      RPC_ANVIL_ETHEREUM1: ${{ secrets.RPC_ANVIL_ETHEREUM1 }}
      ANVIL_FORKS_MNEMONIC: ${{ secrets.ANVIL_FORKS_MNEMONIC }}
      RESULT_ROOT: /tmp/v27-remote-anvil-result
    steps:
      - name: Check out source and reviewed harness history
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install trusted runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Execute complete V27 deposit, harvest, withdrawal, and migration lifecycle
        id: simulation
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "$RESULT_ROOT"

          announce() {
            local key="$1"
            local message="$2"
            local marker="$RESULT_ROOT/.progress-${key}"
            if [[ ! -e "$marker" ]]; then
              touch "$marker"
              echo "::notice title=V27 contract-stack progress::${message}"
              printf -- '- `%s` %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$message" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          scan_progress() {
            shopt -s nullglob
            local file base
            for file in "$RESULT_ROOT"/calls/*.json; do
              base="$(basename "$file")"
              case "$base" in
                *deploy-v27-strategy-1*)
                  announce stack-deployed 'V27 vault, converter, and strategy deployment completed.'
                  ;;
                *cycle-1-deposit*)
                  announce cycle-1-deposit 'Cycle 1 deposit recorded on the remote Anvil fork.'
                  ;;
                *cycle-1-harvest*)
                  announce cycle-1-harvest 'Harvest cycle 1 completed and evidence was recorded.'
                  ;;
                *cycle-2-deposit*)
                  announce cycle-2-deposit 'Cycle 2 deposit recorded on the remote Anvil fork.'
                  ;;
                *cycle-2-harvest*)
                  announce cycle-2-harvest 'Harvest cycle 2 completed and evidence was recorded.'
                  ;;
                *cycle-3-deposit*)
                  announce cycle-3-deposit 'Cycle 3 deposit recorded on the remote Anvil fork.'
                  ;;
                *cycle-3-harvest*)
                  announce cycle-3-harvest 'Harvest cycle 3 completed and evidence was recorded.'
                  ;;
                *cycle-4-deposit*)
                  announce cycle-4-deposit 'Cycle 4 deposit recorded on the remote Anvil fork.'
                  ;;
                *cycle-4-harvest*)
                  announce cycle-4-harvest 'Harvest cycle 4 completed and evidence was recorded.'
                  ;;
                *execute-strategy-1-to-strategy-2-migration*)
                  announce migration 'Strategy 1 to strategy 2 migration completed.'
                  ;;
                *cycle-m1-harvest*)
                  announce post-migration-1 'Post-migration harvest cycle 1 completed.'
                  ;;
                *cycle-m2-harvest*)
                  announce post-migration-2 'Post-migration harvest cycle 2 completed.'
                  ;;
              esac
            done
          }

          printf '## V27 remote-Anvil simulation progress\n\n' >> "$GITHUB_STEP_SUMMARY"
          announce starting 'Simulation started on the persistent remote Anvil fork.'

          bash github-native-sim/jobs/live-fork-v27-v1/run-ci.sh &
          simulation_pid=$!

          (
            while kill -0 "$simulation_pid" 2>/dev/null; do
              scan_progress
              sleep 10
            done
            scan_progress
          ) &
          progress_pid=$!

          wait "$simulation_pid"
          simulation_status=$?
          wait "$progress_pid" || true

          if [[ "$simulation_status" -eq 0 ]]; then
            announce completed 'Full V27 contract-stack simulation completed successfully.'
          else
            announce failed "Simulation stopped with exit code ${simulation_status}; final evidence and the precise blocker will still be uploaded."
          fi

          exit "$simulation_status"

      - name: Publish compact simulation result to PR 136
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if test -f "$RESULT_ROOT/final-validation.json"; then
            body=$(jq -r '
              "### V27 remote-Anvil contract-stack simulation: **" +
              (if .validatedSuccess then "PASSED" else "FAILED" end) + "**\n\n" +
              "- Assurance: `" + (.assurance // "unknown") + "`\n" +
              "- RPC chain ID: `" + ((.rpcChainId // 0) | tostring) + "`\n" +
              "- Calls: `" + ((.callCount // 0) | tostring) + "`\n" +
              "- Successful transactions: `" + ((.successfulTransactionCount // 0) | tostring) + "`\n" +
              "- Assertions passed: `" + ((.passedAssertionCount // 0) | tostring) + "/" + ((.assertionCount // 0) | tostring) + "`\n" +
              "- Harvest cycles: `" + ((.cycleCount // 0) | tostring) + "`\n" +
              "- Post-migration cycles: `" + ((.postMigrationCycleCount // 0) | tostring) + "`\n" +
              "- Fork baseline restored: `" + ((.cleanup.baselineFullyRestored // false) | tostring) + "`\n" +
              (if .reportError then "\nError: `" + (.reportError.message // (.reportError | tostring)) + "`" else "" end)
            ' "$RESULT_ROOT/final-validation.json")
            gh pr comment 136 --repo CurveYield/contract-automation --body "$body"
          else
            tail_text=$(tail -n 30 "$RESULT_ROOT/wrapper-stderr.log" 2>/dev/null | sed 's/`/\\`/g' || true)
            gh pr comment 136 --repo CurveYield/contract-automation --body "### V27 remote-Anvil contract-stack simulation: **FAILED**\n\nNo final validation file was produced.\n\n\`\`\`\n${tail_text}\n\`\`\`"
          fi

      - name: Upload complete simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v27-remote-anvil-contract-stack-${{ github.run_id }}
          path: ${{ env.RESULT_ROOT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Propagate simulation failure
        if: steps.simulation.outcome == 'failure'
        run: exit 1
