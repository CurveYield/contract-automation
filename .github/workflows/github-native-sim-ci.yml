name: Remote Anvil Capability Probe

on:
  push:
    branches:
      - fix/remote-mutable-fork-simulation-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: remote-anvil-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remote-anvil-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RPC_ANVIL_ETHEREUM1: ${{ secrets.RPC_ANVIL_ETHEREUM1 }}
      PROOF_PATH: /tmp/remote-anvil-proof.json
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install trusted dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Probe the persistent ethui Anvil RPC
        id: probe
        continue-on-error: true
        run: node scripts/probe-remote-anvil.mjs

      - name: Publish redacted result to PR 136
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f "$PROOF_PATH"; then
            body=$(jq -r '
              "### Remote Anvil capability probe: **" + (.status | ascii_upcase) + "**\n\n" +
              (if .chainId then "- Chain ID: `" + (.chainId | tostring) + "`\n" else "" end) +
              (if .clientVersion then "- Client: `" + .clientVersion + "`\n" else "" end) +
              (if .capabilities then
                "- Snapshot/revert: `" + (.capabilities.snapshot | tostring) + "`\n" +
                "- Account impersonation: `" + (.capabilities.impersonation | tostring) + "`\n" +
                "- Remote contract deployment: `" + (.capabilities.contractDeployment | tostring) + "`\n" +
                "- Remote contract mutation: `" + (.capabilities.contractMutation | tostring) + "`\n" +
                "- Same-RPC call readback: `" + (.capabilities.sameRpcCallReadBack | tostring) + "`\n" +
                "- Same-RPC storage readback: `" + (.capabilities.sameRpcStorageReadBack | tostring) + "`\n" +
                "- Impersonated native transfer: `" + (.capabilities.nativeTransfer | tostring) + "`\n" +
                "- Time advancement: `" + (.capabilities.timeAdvance | tostring) + "`\n" +
                "- debug_traceTransaction: `" + (.capabilities.debugTraceTransaction.supported | tostring) + "`\n"
              else "" end) +
              (if .revertProof then
                "- Baseline restored: `" + ((.revertProof.reverted and .revertProof.actorBalanceMatchesBaseline and .revertProof.recipientBalanceMatchesBaseline and .revertProof.deployedCodeRemoved) | tostring) + "`\n"
              else "" end) +
              (if .error then "\nError: `" + .error.message + "`" else "" end)
            ' "$PROOF_PATH")
            gh pr comment 136 --repo CurveYield/contract-automation --body "$body"
          else
            gh pr comment 136 --repo CurveYield/contract-automation --body '### Remote Anvil capability probe: **FAILED**\n\nThe probe exited before producing a redacted proof file.'
          fi

      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-anvil-capability-${{ github.run_id }}
          path: /tmp/remote-anvil-proof.json
          if-no-files-found: warn
          retention-days: 30

      - name: Propagate probe failure
        if: steps.probe.outcome == 'failure'
        run: exit 1
