name: Tier 3 No-Install Verification v2

on:
  push:
    branches:
      - audit-round5/tier3-controller-ui-v1
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tier3-no-install-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact feature-branch source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Verify runtime and no-install boundary
        id: boundary
        shell: bash
        run: |
          set -euo pipefail
          node --version
          test ! -d node_modules
          workflow=.github/workflows/tier3-no-install-v2.yml
          ! grep -Eq '^[[:space:]]*(npm[[:space:]]+(install|ci)|pnpm([[:space:]]|$)|yarn([[:space:]]|$)|npx([[:space:]]|$)|forge([[:space:]]|$)|hardhat([[:space:]]|$)|solc([[:space:]]|$)|wrangler([[:space:]]|$))' "$workflow"

      - name: Run Tier 3 dependency-free tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            packages/protocol/test/tier3-controller-v1.test.mjs \
            apps/api/test/controller-adapter-v1.test.mjs \
            apps/api/test/controller-command-adapter-v1.test.mjs \
            apps/api/test/controller-entry-v1.test.mjs \
            packages/runner/test/audit-round5-tier3-controller-secret-v1.test.mjs \
            apps/web/test/tier3-client-v1.test.mjs \
            apps/web/test/controller-view-v1.test.mjs \
            apps/web/test/tier3-operator-shell-v1.test.mjs

      - name: Run dependency-free legacy regressions
        id: legacy
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            apps/api/test/entry.test.mjs \
            apps/web/test/client.test.mjs

      - name: Check Tier 3 JavaScript syntax
        id: syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check packages/protocol/src/tier3-controller-v1.mjs
          node --check apps/api/src/controller-adapter-v1.mjs
          node --check apps/api/src/controller-command-adapter-v1.mjs
          node --check apps/api/src/entry.mjs
          node --check apps/web/src/client.mjs
          node --check apps/web/src/controller-view-v1.mjs
          node --check apps/web/public/app.js
          node --check scripts/build.mjs

      - name: Check Pages copy and controller safety invariants
        id: invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -F "client.mjs'), path.join(output, 'client.js')" scripts/build.mjs >/dev/null
          grep -F "controller-view-v1.mjs'), path.join(output, 'controller-view.js')" scripts/build.mjs >/dev/null
          grep -F 'AUDIT_CONTROLLER_INTAKE_ISSUE = "64"' apps/api/wrangler.toml >/dev/null
          grep -F "AUDIT_CONTROLLER_GITHUB_TOKEN" apps/api/src/controller-adapter-v1.mjs >/dev/null
          grep -F "AUDIT_CONTROLLER_GITHUB_TOKEN" apps/api/src/controller-command-adapter-v1.mjs >/dev/null
          ! grep -Eq 'innerHTML\s*=' apps/web/public/app.js
          ! grep -Eq 'mailboxIssueNumber|AUDIT_CONTROLLER_INTAKE_ISSUE' apps/web/public/app.js
          ! grep -Eq 'issue-number|issueNumber' apps/web/public/index.html

      - name: Publish sanitized verification receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOUNDARY_OUTCOME: ${{ steps.boundary.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          LEGACY_OUTCOME: ${{ steps.legacy.outcome }}
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          INVARIANTS_OUTCOME: ${{ steps.invariants.outcome }}
        run: |
          set -euo pipefail
          overall=PASS
          for outcome in "$BOUNDARY_OUTCOME" "$TESTS_OUTCOME" "$LEGACY_OUTCOME" "$SYNTAX_OUTCOME" "$INVARIANTS_OUTCOME"; do
            if [[ "$outcome" != "success" ]]; then
              overall=FAIL
            fi
          done
          receipt=$(cat <<EOF
          ## Tier 3 No-Install Verification v2

          - result: \`$overall\`
          - run: \`$GITHUB_RUN_ID\`
          - source SHA: \`$GITHUB_SHA\`
          - branch: \`audit-round5/tier3-controller-ui-v1\`
          - boundary check: \`$BOUNDARY_OUTCOME\`
          - Tier 3 tests: \`$TESTS_OUTCOME\`
          - dependency-free legacy regressions: \`$LEGACY_OUTCOME\`
          - JavaScript syntax: \`$SYNTAX_OUTCOME\`
          - safety/static invariants: \`$INVARIANTS_OUTCOME\`
          - dependency installation/download: \`NO\`
          - repository build: \`NO\`
          - Solidity compiler/toolchain: \`NO\`
          - Cloudflare deployment: \`NO\`
          - controller mailbox mutation: \`NO\`
          - wallet/signing/broadcast: \`NO\`

          This receipt contains no secret values, raw response bodies, RPC URLs, service credentials, or upstream error text.
          EOF
          )
          gh issue comment 170 --repo "$GITHUB_REPOSITORY" --body "$receipt"
