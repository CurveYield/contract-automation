name: Live Fork Upgrade CI

on:
  push:
    branches:
      - agent/live-fork-rpc-routing-design
  pull_request:
    paths:
      - 'packages/protocol/**'
      - 'packages/runner/**'
      - 'packages/github-native-sim/**'
      - 'scripts/live-fork-engine-smoke.mjs'
      - '.github/workflows/live-fork-upgrade-ci.yml'
      - '.github/workflows/github-native-simulate.yml'
      - '.github/workflows/simulate.yml'
      - 'docs/live-fork-*.md'
      - 'github-native-sim/jobs/live-fork-v27-v1/**'

permissions:
  contents: read

concurrency:
  group: live-fork-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install trusted dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run focused live-fork tests
        run: >-
          node --test
          packages/runner/test/archive-rpc-pool.test.mjs
          packages/runner/test/live-fork-config.test.mjs
          packages/runner/test/live-fork-proxy.test.mjs
          packages/runner/test/live-fork-runtime-actions.test.mjs
          packages/runner/test/run-job-live-fork.test.mjs

      - name: Run complete repository tests
        run: npm test

      - name: Run lint and build
        run: npm run lint && npm run build

      - name: Validate changed JavaScript syntax
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find packages scripts -type f -name '*.mjs' -print | sort)

  live-fork-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RPC_ETHEREUM: ${{ secrets.RPC_ETHEREUM }}
      SIM_ARCHIVE_PRIMARY_ETHEREUM_01: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_01 }}
      SIM_ARCHIVE_PRIMARY_ETHEREUM_02: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_02 }}
      SIM_ARCHIVE_PRIMARY_ETHEREUM_03: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_03 }}
      SIM_ARCHIVE_PRIMARY_ETHEREUM_04: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_04 }}
      SIM_ARCHIVE_PRIMARY_ETHEREUM_05: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_05 }}
      SIM_ARCHIVE_PRIMARY_ETHEREUM_06: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_06 }}
      SIM_ARCHIVE_PRIMARY_ETHEREUM_07: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_07 }}
      SIM_ARCHIVE_SECONDARY_ETHEREUM_01: ${{ secrets.SIM_ARCHIVE_SECONDARY_ETHEREUM_01 }}
      SIM_ARCHIVE_SECONDARY_ETHEREUM_02: ${{ secrets.SIM_ARCHIVE_SECONDARY_ETHEREUM_02 }}
      SIM_ARCHIVE_SECONDARY_ETHEREUM_03: ${{ secrets.SIM_ARCHIVE_SECONDARY_ETHEREUM_03 }}
      LIVE_FORK_SMOKE_OUTPUT: ${{ runner.temp }}/live-fork-engine-smoke
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install trusted dependencies and EDR
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund hardhat@3.12.0

      - name: Execute live Ethereum fork smoke
        id: execute
        continue-on-error: true
        run: node scripts/live-fork-engine-smoke.mjs

      - name: Upload live fork evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-fork-engine-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/live-fork-engine-smoke
          if-no-files-found: error
          retention-days: 30

      - name: Propagate smoke failure
        if: steps.execute.outcome == 'failure'
        run: exit 1
