name: Bootstrap Contract Automation Source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/source.part-*'
      - '.github/workflows/bootstrap-contract-automation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-contract-automation
  cancel-in-progress: false

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part-* > .bootstrap/contract-automation-source.tar.gz.b64
          base64 --decode .bootstrap/contract-automation-source.tar.gz.b64 > .bootstrap/contract-automation-source.tar.gz
          echo "58a3492061799c18fe6908c10fdcb5231f2fd934241e1b7eb63c41a9003476eb  .bootstrap/contract-automation-source.tar.gz" | sha256sum --check --strict

      - name: Expand complete source tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf .bootstrap/contract-automation-source.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-contract-automation.yml

      - name: Verify migrated source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-files | wc -l)" -ge 1
          test -f package.json
          test -f apps/api/src/index.mjs
          test -f apps/web/public/index.html
          test -f packages/runner/src/engine.mjs
          test -f integrations/custom-gpt/action-schema.json
          test -f integrations/github-bridge/README.md
          test -f .github/workflows/deploy.yml
          test -f .github/workflows/simulate.yml
          test -f .github/workflows/github-bridge.yml
          test -f infra/r2-cors.json
          test -f infra/r2-lifecycle.json
          test "$(find . -type f -not -path './.git/*' | wc -l)" -ge 58

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source tree already expanded"
            exit 0
          fi
          git commit -m "Migrate complete contract automation suite"
          git push origin HEAD:main
