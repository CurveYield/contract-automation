name: Pages Routing Diagnostic V2

on:
  push:
    branches:
      - orchestrator/round4-ci-base-v1
    paths:
      - .agent-control/v1/orchestrator/PAGES_ROUTING_DIAGNOSTIC_REQUEST_v2.json

permissions:
  contents: read
  issues: write

concurrency:
  group: curveyield-preflight-pages-routing-diagnostic-v2
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/orchestrator/round4-ci-base-v1' && github.event.before == '1f81be09b16614b24d81c57fa388447231dd629a' }}
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RELEASE_BRANCH: orchestrator/round4-ci-base-v1
      REQUEST_PATH: .agent-control/v1/orchestrator/PAGES_ROUTING_DIAGNOSTIC_REQUEST_v2.json
      REQUEST_ID: round5-pages-routing-diagnostic-20260807-v2
      EXPECTED_BEFORE_SHA: 1f81be09b16614b24d81c57fa388447231dd629a
      APPLICATION_SOURCE_SHA: 2c6e543dfcaa17ca975bbde3c15302269bbf8072
      V11_RUN_ID: '30832528012'
      V11_JOB_ID: '91749723106'
      V11_DEPLOYMENT_SHORT_ID: c3d3e149
      CLOUDFLARE_API_BASE: https://api.cloudflare.com/client/v4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
      CUSTOM_DOMAIN_NAME: preflight.curveyield.online

    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Verify one-time GET-only diagnostic request v2
        shell: bash
        env:
          EVENT_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test "$EVENT_BEFORE_SHA" = "$EXPECTED_BEFORE_SHA"
          test "$GITHUB_REF" = "refs/heads/$RELEASE_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$PAGES_PROJECT_NAME" = "curveyield-preflight"
          jq -e \
            --arg request_id "$REQUEST_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg release_branch "$RELEASE_BRANCH" \
            --arg expected_before "$EXPECTED_BEFORE_SHA" \
            --arg application_source "$APPLICATION_SOURCE_SHA" \
            --arg project "$PAGES_PROJECT_NAME" \
            --arg domain "$CUSTOM_DOMAIN_NAME" \
            '
              .schemaVersion == "round5-pages-routing-diagnostic-request-v2" and
              .requestId == $request_id and
              .repository == $repository and
              .releaseBranch == $release_branch and
              .expectedBeforeSha == $expected_before and
              .acceptedApplicationSource == $application_source and
              .v11Run == 30832528012 and
              .v11Job == 91749723106 and
              .v11DeploymentShortId == "c3d3e149" and
              .pagesProject == $project and
              .customDomain == $domain and
              .activeNetworks == ["ethereum", "base"] and
              .defaultNetwork == "base" and
              .checks == [
                "pages-project-production-branch-and-subdomain",
                "production-deployment-list-v11-binding",
                "exact-v11-deployment-metadata",
                "pages-domain-list-association",
                "exact-pages-domain-status",
                "immutable-v11-deployment-content",
                "project-subdomain-content",
                "custom-domain-content",
                "cache-busted-project-and-custom-content"
              ] and
              .readOnly == true and
              .cloudflareMethodsAllowed == "GET-only" and
              .dependencyInstallationAllowed == false and
              .repositoryCompilationAllowed == false and
              .cloudflareMutationAllowed == false and
              .pagesDeploymentAllowed == false and
              .workerDeploymentAllowed == false and
              .secretMutationAllowed == false and
              .r2MutationAllowed == false and
              .jobOrUploadSubmissionAllowed == false and
              .rpcCallsAllowed == false and
              .walletSigningAllowed == false and
              .publicTransactionBroadcastAllowed == false and
              .secretValuesIncluded == false and
              .failedOrHistoricalWorkflowRerunAllowed == false
            ' "$REQUEST_PATH" >/dev/null
          DIAGNOSTIC_TEMP_DIR="$RUNNER_TEMP/pages-routing-diagnostic-v2"
          mkdir -p "$DIAGNOSTIC_TEMP_DIR"
          echo "DIAGNOSTIC_TEMP_DIR=$DIAGNOSTIC_TEMP_DIR" >> "$GITHUB_ENV"
          echo "REQUEST_CHECK=success" >> "$GITHUB_ENV"

      - name: Read Pages project deployment and domain metadata
        shell: bash
        run: |
          set -euo pipefail
          project_file="$DIAGNOSTIC_TEMP_DIR/project.json"
          deployments_file="$DIAGNOSTIC_TEMP_DIR/production-deployments.json"
          exact_file="$DIAGNOSTIC_TEMP_DIR/exact-v11-deployment.json"
          domains_file="$DIAGNOSTIC_TEMP_DIR/domains.json"
          domain_file="$DIAGNOSTIC_TEMP_DIR/domain.json"

          curl --fail --silent --show-error --max-time 20 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --output "$project_file" \
            "$CLOUDFLARE_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT_NAME"
          curl --fail --silent --show-error --max-time 20 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --output "$deployments_file" \
            "$CLOUDFLARE_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT_NAME/deployments?env=production&per_page=50"
          curl --fail --silent --show-error --max-time 20 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --output "$domains_file" \
            "$CLOUDFLARE_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT_NAME/domains"
          curl --fail --silent --show-error --max-time 20 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --output "$domain_file" \
            "$CLOUDFLARE_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT_NAME/domains/preflight.curveyield.online"

          jq -e '.success == true and (.result | type) == "object"' "$project_file" >/dev/null
          jq -e '.success == true and (.result | type) == "array"' "$deployments_file" >/dev/null
          jq -e '.success == true and (.result | type) == "array"' "$domains_file" >/dev/null
          jq -e '.success == true and (.result | type) == "object"' "$domain_file" >/dev/null

          if jq -e --arg branch "$RELEASE_BRANCH" '.result.production_branch == $branch' "$project_file" >/dev/null; then
            pages_production_branch_ok=true
          else
            pages_production_branch_ok=false
          fi

          project_subdomain="$(jq -r '.result.subdomain // ""' "$project_file")"
          test -n "$project_subdomain"
          PROJECT_SUBDOMAIN_URL="$(python3 - "$project_subdomain" <<'PY'
          import sys
          from urllib.parse import urlparse
          raw = sys.argv[1].strip()
          candidate = raw if '://' in raw else 'https://' + raw
          parsed = urlparse(candidate)
          if parsed.scheme != 'https' or not parsed.hostname or not parsed.hostname.endswith('.pages.dev'):
              raise SystemExit('project subdomain is outside expected Pages host class')
          if parsed.username or parsed.password or parsed.port:
              raise SystemExit('project subdomain contains unexpected authority fields')
          print('https://' + parsed.hostname)
          PY
          )"
          echo "PROJECT_SUBDOMAIN_URL=$PROJECT_SUBDOMAIN_URL" >> "$GITHUB_ENV"

          short_match_count="$(jq -r --arg short "$V11_DEPLOYMENT_SHORT_ID" '[.result[] | select((.short_id // "") == $short or ((.id // "") | startswith($short)))] | length' "$deployments_file")"
          bound_match_count="$(jq -r \
            --arg short "$V11_DEPLOYMENT_SHORT_ID" \
            --arg branch "$RELEASE_BRANCH" \
            --arg commit "$APPLICATION_SOURCE_SHA" \
            '[.result[] | select(
              ((.short_id // "") == $short or ((.id // "") | startswith($short))) and
              .environment == "production" and
              .deployment_trigger.metadata.branch == $branch and
              .deployment_trigger.metadata.commit_hash == $commit and
              .latest_stage.name == "deploy" and
              .latest_stage.status == "success"
            )] | length' "$deployments_file")"
          if [[ "$bound_match_count" == "1" ]]; then
            production_v11_list_ok=true
          else
            production_v11_list_ok=false
          fi
          test "$short_match_count" = "1"
          V11_DEPLOYMENT_ID="$(jq -r --arg short "$V11_DEPLOYMENT_SHORT_ID" '.result[] | select((.short_id // "") == $short or ((.id // "") | startswith($short))) | .id' "$deployments_file")"
          test -n "$V11_DEPLOYMENT_ID"
          echo "V11_DEPLOYMENT_ID=$V11_DEPLOYMENT_ID" >> "$GITHUB_ENV"

          curl --fail --silent --show-error --max-time 20 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --output "$exact_file" \
            "$CLOUDFLARE_API_BASE/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT_NAME/deployments/$V11_DEPLOYMENT_ID"
          jq -e '.success == true and (.result | type) == "object"' "$exact_file" >/dev/null

          if jq -e \
            --arg short "$V11_DEPLOYMENT_SHORT_ID" \
            --arg branch "$RELEASE_BRANCH" \
            --arg commit "$APPLICATION_SOURCE_SHA" \
            '
              ((.result.short_id // "") == $short or ((.result.id // "") | startswith($short))) and
              .result.environment == "production" and
              .result.deployment_trigger.metadata.branch == $branch and
              .result.deployment_trigger.metadata.commit_hash == $commit and
              .result.latest_stage.name == "deploy" and
              .result.latest_stage.status == "success"
            ' "$exact_file" >/dev/null
          then
            exact_v11_metadata_ok=true
          else
            exact_v11_metadata_ok=false
          fi

          IMMUTABLE_DEPLOYMENT_URL="$(jq -r '.result.url // ""' "$exact_file")"
          test -n "$IMMUTABLE_DEPLOYMENT_URL"
          IMMUTABLE_DEPLOYMENT_URL="$(python3 - "$IMMUTABLE_DEPLOYMENT_URL" <<'PY'
          import sys
          from urllib.parse import urlparse
          parsed = urlparse(sys.argv[1].strip())
          if parsed.scheme != 'https' or not parsed.hostname or not parsed.hostname.endswith('.pages.dev'):
              raise SystemExit('exact deployment URL is outside expected Pages host class')
          if parsed.username or parsed.password or parsed.port:
              raise SystemExit('exact deployment URL contains unexpected authority fields')
          print('https://' + parsed.hostname)
          PY
          )"
          echo "IMMUTABLE_DEPLOYMENT_URL=$IMMUTABLE_DEPLOYMENT_URL" >> "$GITHUB_ENV"

          domain_list_count="$(jq -r --arg domain "$CUSTOM_DOMAIN_NAME" '[.result[] | select((.name // "") == $domain)] | length' "$domains_file")"
          if [[ "$domain_list_count" == "1" ]]; then
            pages_domain_association_ok=true
          else
            pages_domain_association_ok=false
          fi
          if jq -e --arg domain "$CUSTOM_DOMAIN_NAME" '.result.name == $domain and .result.status == "active"' "$domain_file" >/dev/null; then
            pages_domain_status_ok=true
          else
            pages_domain_status_ok=false
          fi

          echo "PAGES_PRODUCTION_BRANCH_OK=$pages_production_branch_ok" >> "$GITHUB_ENV"
          echo "PRODUCTION_V11_LIST_OK=$production_v11_list_ok" >> "$GITHUB_ENV"
          echo "EXACT_V11_METADATA_OK=$exact_v11_metadata_ok" >> "$GITHUB_ENV"
          echo "PAGES_DOMAIN_ASSOCIATION_OK=$pages_domain_association_ok" >> "$GITHUB_ENV"
          echo "PAGES_DOMAIN_STATUS_OK=$pages_domain_status_ok" >> "$GITHUB_ENV"
          echo "METADATA_CHECK=success" >> "$GITHUB_ENV"

      - name: Classify immutable deployment project subdomain and custom-domain content
        shell: bash
        run: |
          set -euo pipefail

          fetch_asset() {
            local base="$1"
            local path="$2"
            local output="$3"
            local nonce="${4:-}"
            local url="${base%/}${path}"
            if [[ -n "$nonce" ]]; then
              if [[ "$url" == *\?* ]]; then
                url="$url&routing-diagnostic=$nonce"
              else
                url="$url?routing-diagnostic=$nonce"
              fi
            fi
            if curl --fail --silent --show-error --location --max-time 20 \
              --header 'Cache-Control: no-cache' \
              --output "$output" \
              "$url"
            then
              test -s "$output"
              return 0
            fi
            rm -f "$output"
            return 1
          }

          mkdir -p "$DIAGNOSTIC_TEMP_DIR/content"
          nonce="$REQUEST_ID-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          immutable_fetch_ok=true
          fetch_asset "$IMMUTABLE_DEPLOYMENT_URL" "/" "$DIAGNOSTIC_TEMP_DIR/content/immutable-index.html" || immutable_fetch_ok=false
          fetch_asset "$IMMUTABLE_DEPLOYMENT_URL" "/app.js" "$DIAGNOSTIC_TEMP_DIR/content/immutable-app.js" || immutable_fetch_ok=false

          project_fetch_ok=true
          fetch_asset "$PROJECT_SUBDOMAIN_URL" "/" "$DIAGNOSTIC_TEMP_DIR/content/project-index.html" || project_fetch_ok=false
          fetch_asset "$PROJECT_SUBDOMAIN_URL" "/app.js" "$DIAGNOSTIC_TEMP_DIR/content/project-app.js" || project_fetch_ok=false

          project_bust_fetch_ok=true
          fetch_asset "$PROJECT_SUBDOMAIN_URL" "/" "$DIAGNOSTIC_TEMP_DIR/content/project-bust-index.html" "$nonce-project" || project_bust_fetch_ok=false
          fetch_asset "$PROJECT_SUBDOMAIN_URL" "/app.js" "$DIAGNOSTIC_TEMP_DIR/content/project-bust-app.js" "$nonce-project" || project_bust_fetch_ok=false

          custom_url="https://$CUSTOM_DOMAIN_NAME"
          custom_fetch_ok=true
          fetch_asset "$custom_url" "/" "$DIAGNOSTIC_TEMP_DIR/content/custom-index.html" || custom_fetch_ok=false
          fetch_asset "$custom_url" "/app.js" "$DIAGNOSTIC_TEMP_DIR/content/custom-app.js" || custom_fetch_ok=false

          custom_bust_fetch_ok=true
          fetch_asset "$custom_url" "/" "$DIAGNOSTIC_TEMP_DIR/content/custom-bust-index.html" "$nonce-custom" || custom_bust_fetch_ok=false
          fetch_asset "$custom_url" "/app.js" "$DIAGNOSTIC_TEMP_DIR/content/custom-bust-app.js" "$nonce-custom" || custom_bust_fetch_ok=false

          python3 - "$DIAGNOSTIC_TEMP_DIR/content" "$DIAGNOSTIC_TEMP_DIR/content-metrics.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          expected = ['ethereum', 'base']
          deferred = ('arbitrum', 'fraxtal', 'katana', 'optimism', 'polygon')
          required_client = (
              'function syncChainOptions(chains)',
              'syncChainOptions(response.chains)',
              'Object.entries(chains)',
              'elements.chain.replaceChildren',
              "preferred === 'base'",
          )

          def classify(prefix):
              html_path = root / f'{prefix}-index.html'
              app_path = root / f'{prefix}-app.js'
              if not html_path.is_file() or not app_path.is_file() or html_path.stat().st_size == 0 or app_path.stat().st_size == 0:
                  return {'classification': 'unreachable', 'optionCount': 0, 'baseSelected': False, 'clientMatches': False}
              html = html_path.read_text(encoding='utf-8', errors='replace')
              app = app_path.read_text(encoding='utf-8', errors='replace')
              match = re.search(r'<select id="chain">([\s\S]*?)</select>', html)
              if match is None:
                  return {'classification': 'stale-or-unexpected', 'optionCount': 0, 'baseSelected': False, 'clientMatches': False}
              selector = match.group(1)
              options = re.findall(r'<option value="([^"]+)"([^>]*)>', selector)
              values = [value for value, _ in options]
              selected = [value for value, attrs in options if re.search(r'\bselected\b', attrs)]
              selector_matches = values == expected and selected == ['base'] and not any(name in selector.lower() for name in deferred)
              client_matches = all(fragment in app for fragment in required_client)
              return {
                  'classification': 'accepted' if selector_matches and client_matches else 'stale-or-unexpected',
                  'optionCount': len(values),
                  'baseSelected': selected == ['base'],
                  'clientMatches': client_matches,
              }

          result = {prefix: classify(prefix) for prefix in ('immutable', 'project', 'project-bust', 'custom', 'custom-bust')}
          output.write_text(json.dumps(result, sort_keys=True), encoding='utf-8')
          PY

          pair_digest() {
            local prefix="$1"
            if [[ ! -s "$DIAGNOSTIC_TEMP_DIR/content/${prefix}-index.html" || ! -s "$DIAGNOSTIC_TEMP_DIR/content/${prefix}-app.js" ]]; then
              printf '%s' unavailable
              return 0
            fi
            {
              sha256sum "$DIAGNOSTIC_TEMP_DIR/content/${prefix}-index.html"
              sha256sum "$DIAGNOSTIC_TEMP_DIR/content/${prefix}-app.js"
            } | awk '{print $1}' | sha256sum | awk '{print $1}'
          }

          immutable_digest="$(pair_digest immutable)"
          project_digest="$(pair_digest project)"
          project_bust_digest="$(pair_digest project-bust)"
          custom_digest="$(pair_digest custom)"
          custom_bust_digest="$(pair_digest custom-bust)"

          [[ "$immutable_digest" != unavailable && "$project_digest" == "$immutable_digest" ]] && project_hash_match=true || project_hash_match=false
          [[ "$immutable_digest" != unavailable && "$project_bust_digest" == "$immutable_digest" ]] && project_bust_hash_match=true || project_bust_hash_match=false
          [[ "$immutable_digest" != unavailable && "$custom_digest" == "$immutable_digest" ]] && custom_hash_match=true || custom_hash_match=false
          [[ "$immutable_digest" != unavailable && "$custom_bust_digest" == "$immutable_digest" ]] && custom_bust_hash_match=true || custom_bust_hash_match=false

          immutable_class="$(jq -r '.immutable.classification' "$DIAGNOSTIC_TEMP_DIR/content-metrics.json")"
          project_class="$(jq -r '.project.classification' "$DIAGNOSTIC_TEMP_DIR/content-metrics.json")"
          project_bust_class="$(jq -r '."project-bust".classification' "$DIAGNOSTIC_TEMP_DIR/content-metrics.json")"
          custom_class="$(jq -r '.custom.classification' "$DIAGNOSTIC_TEMP_DIR/content-metrics.json")"
          custom_bust_class="$(jq -r '."custom-bust".classification' "$DIAGNOSTIC_TEMP_DIR/content-metrics.json")"

          echo "IMMUTABLE_CONTENT_CLASS=$immutable_class" >> "$GITHUB_ENV"
          echo "PROJECT_SUBDOMAIN_CONTENT_CLASS=$project_class" >> "$GITHUB_ENV"
          echo "PROJECT_SUBDOMAIN_CACHE_BUST_CONTENT_CLASS=$project_bust_class" >> "$GITHUB_ENV"
          echo "CUSTOM_DOMAIN_CONTENT_CLASS=$custom_class" >> "$GITHUB_ENV"
          echo "CUSTOM_DOMAIN_CACHE_BUST_CONTENT_CLASS=$custom_bust_class" >> "$GITHUB_ENV"
          echo "PROJECT_SUBDOMAIN_HASH_MATCH=$project_hash_match" >> "$GITHUB_ENV"
          echo "PROJECT_SUBDOMAIN_CACHE_BUST_HASH_MATCH=$project_bust_hash_match" >> "$GITHUB_ENV"
          echo "CUSTOM_DOMAIN_HASH_MATCH=$custom_hash_match" >> "$GITHUB_ENV"
          echo "CUSTOM_DOMAIN_CACHE_BUST_HASH_MATCH=$custom_bust_hash_match" >> "$GITHUB_ENV"
          echo "IMMUTABLE_OPTION_COUNT=$(jq -r '.immutable.optionCount' "$DIAGNOSTIC_TEMP_DIR/content-metrics.json")" >> "$GITHUB_ENV"
          echo "PROJECT_OPTION_COUNT=$(jq -r '.project.optionCount' "$DIAGNOSTIC_TEMP_DIR/content-metrics.json")" >> "$GITHUB_ENV"
          echo "CUSTOM_OPTION_COUNT=$(jq -r '.custom.optionCount' "$DIAGNOSTIC_TEMP_DIR/content-metrics.json")" >> "$GITHUB_ENV"
          echo "CONTENT_CHECK=success" >> "$GITHUB_ENV"

      - name: Derive bounded Pages routing diagnosis
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EXACT_V11_METADATA_OK:-false}" != "true" ]]; then
            diagnosis=exact-v11-deployment-metadata-mismatch
          elif [[ "${PRODUCTION_V11_LIST_OK:-false}" != "true" ]]; then
            diagnosis=production-deployment-list-mismatch
          elif [[ "${PAGES_PRODUCTION_BRANCH_OK:-false}" != "true" ]]; then
            diagnosis=pages-production-branch-mismatch
          elif [[ "${PAGES_DOMAIN_ASSOCIATION_OK:-false}" != "true" || "${PAGES_DOMAIN_STATUS_OK:-false}" != "true" ]]; then
            diagnosis=pages-domain-association-or-status-mismatch
          elif [[ "${IMMUTABLE_CONTENT_CLASS:-unreachable}" != "accepted" ]]; then
            diagnosis=immutable-deployment-content-mismatch
          elif [[ "${PROJECT_SUBDOMAIN_CONTENT_CLASS:-unreachable}" != "accepted" || "${PROJECT_SUBDOMAIN_CACHE_BUST_CONTENT_CLASS:-unreachable}" != "accepted" || "${PROJECT_SUBDOMAIN_HASH_MATCH:-false}" != "true" || "${PROJECT_SUBDOMAIN_CACHE_BUST_HASH_MATCH:-false}" != "true" ]]; then
            diagnosis=project-subdomain-routing-mismatch
          elif [[ "${CUSTOM_DOMAIN_CONTENT_CLASS:-unreachable}" != "accepted" || "${CUSTOM_DOMAIN_CACHE_BUST_CONTENT_CLASS:-unreachable}" != "accepted" || "${CUSTOM_DOMAIN_HASH_MATCH:-false}" != "true" || "${CUSTOM_DOMAIN_CACHE_BUST_HASH_MATCH:-false}" != "true" ]]; then
            diagnosis=custom-domain-routing-mismatch
          else
            diagnosis=no-current-routing-mismatch-detected
          fi
          echo "DERIVED_DIAGNOSIS=$diagnosis" >> "$GITHUB_ENV"
          echo "DIAGNOSIS_CHECK=success" >> "$GITHUB_ENV"

      - name: Clean transient diagnostic files
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DIAGNOSTIC_TEMP_DIR:-}" ]]; then
            rm -rf "$DIAGNOSTIC_TEMP_DIR"
          fi

      - name: Report Pages routing diagnostic v2 result
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          comment_file="$(mktemp)"
          trap 'rm -f "$comment_file"' EXIT
          cat > "$comment_file" <<EOF
          ## Pages routing diagnostic v2 result

          - workflow run: \`$GITHUB_RUN_ID\`
          - workflow job status: \`$DIAGNOSTIC_JOB_STATUS\`
          - diagnostic source SHA: \`$GITHUB_SHA\`
          - accepted application source SHA: \`$APPLICATION_SOURCE_SHA\`
          - historical v11 run examined: \`$V11_RUN_ID\`
          - historical v11 job examined: \`$V11_JOB_ID\`
          - historical v11 deployment short ID: \`$V11_DEPLOYMENT_SHORT_ID\`
          - request verification: \`${REQUEST_CHECK:-not-run}\`
          - metadata GET gate: \`${METADATA_CHECK:-not-run}\`
          - content GET gate: \`${CONTENT_CHECK:-not-run}\`
          - Pages production branch matches release branch: \`${PAGES_PRODUCTION_BRANCH_OK:-not-run}\`
          - production deployment list contains exact v11 binding: \`${PRODUCTION_V11_LIST_OK:-not-run}\`
          - exact v11 deployment metadata matches: \`${EXACT_V11_METADATA_OK:-not-run}\`
          - custom domain listed on Pages project: \`${PAGES_DOMAIN_ASSOCIATION_OK:-not-run}\`
          - exact custom domain status active: \`${PAGES_DOMAIN_STATUS_OK:-not-run}\`
          - immutable-deployment-content: \`${IMMUTABLE_CONTENT_CLASS:-not-run}\`
          - immutable deployment option count: \`${IMMUTABLE_OPTION_COUNT:-not-run}\`
          - project-subdomain-content: \`${PROJECT_SUBDOMAIN_CONTENT_CLASS:-not-run}\`
          - project subdomain cache-bust content: \`${PROJECT_SUBDOMAIN_CACHE_BUST_CONTENT_CLASS:-not-run}\`
          - project subdomain option count: \`${PROJECT_OPTION_COUNT:-not-run}\`
          - project subdomain matches immutable assets: \`${PROJECT_SUBDOMAIN_HASH_MATCH:-not-run}\`
          - project subdomain cache-bust matches immutable assets: \`${PROJECT_SUBDOMAIN_CACHE_BUST_HASH_MATCH:-not-run}\`
