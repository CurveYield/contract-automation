name: Regenerate Audit Specification Manifest Once

on:
  pull_request:
    paths:
      - ".github/workflows/audit-repair-spec-manifest.yml"

permissions:
  contents: write

concurrency:
  group: audit-spec-manifest-once
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.head_ref == 'audit-repair/phases-1-3-v1' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit-repair/phases-1-3-v1
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Regenerate manifest
        run: node scripts/rebuild-audit-spec-manifest.mjs
      - name: Commit regenerated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/specifications-v2/MANIFEST_v2.json
          git commit -m "docs: regenerate Audit specification manifest"
          git push origin "HEAD:audit-repair/phases-1-3-v1"
