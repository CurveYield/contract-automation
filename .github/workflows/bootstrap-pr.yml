name: Expand Contract Automation Source

on:
  pull_request:
    branches: [main]
    paths:
      - '.actions-probe'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        run: |
          set -euo pipefail
          cat .bootstrap/source.part-* > .bootstrap/source.tar.gz.b64
          base64 --decode .bootstrap/source.tar.gz.b64 > .bootstrap/source.tar.gz
          echo "58a3492061799c18fe6908c10fdcb5231f2fd934241e1b7eb63c41a9003476eb  .bootstrap/source.tar.gz" | sha256sum --check --strict

      - name: Expand and verify complete source tree
        run: |
          set -euo pipefail
          tar -xzf .bootstrap/source.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-contract-automation.yml
          rm -f .github/workflows/bootstrap-pr.yml
          rm -f .github/workflows/actions-probe.yml
          test -f package.json
          test -f apps/api/src/index.mjs
          test -f apps/web/public/index.html
          test -f packages/runner/src/engine.mjs
          test -f integrations/custom-gpt/action-schema.json
          test -f integrations/github-bridge/README.md
          test -f .github/workflows/deploy.yml
          test -f .github/workflows/simulate.yml
          test -f .github/workflows/github-bridge.yml
          test -f infra/r2-cors.json
          test -f infra/r2-lifecycle.json
          test "$(find . -type f -not -path './.git/*' | wc -l)" -ge 58

      - name: Commit migrated source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate complete contract automation suite"
          git push origin HEAD:main
