name: Test CurveYield Audit Phase 1

on:
  pull_request:
    paths:
      - "apps/audit-*/**"
      - "packages/audit-*/**"
      - "infra/audit-cloudflare/**"
      - "docs/audit/**"
      - "scripts/build-audit.mjs"
      - "scripts/check-audit-boundary.mjs"
      - "test/audit-*.test.mjs"
      - "test/boundary/**"
      - ".github/workflows/audit-*.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

concurrency:
  group: curveyield-audit-phase1-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted repair PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: audit-repair/phases-1-3-v1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Correct Ganache bundled optional dependency metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          const key = 'node_modules/ganache/node_modules/fsevents';
          const entry = lock.packages?.[key];
          const declared = lock.packages?.['node_modules/ganache/node_modules/chokidar']?.optionalDependencies?.fsevents;
          if (!entry || declared !== '~2.3.2' || entry.version !== '2.3.2' || !Array.isArray(entry.os) || !entry.os.includes('darwin')) {
            throw new Error('Unexpected Ganache fsevents lockfile shape');
          }
          entry.optional = true;
          delete entry.extraneous;
          fs.writeFileSync(path, `${JSON.stringify(lock, null, 2)}\n`);
          NODE
      - name: Commit corrected lockfile on trusted repair PR
        if: github.event_name == 'pull_request' && github.head_ref == 'audit-repair/phases-1-3-v1' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile metadata already corrected"
            exit 0
          fi
          git commit -m "chore: mark Ganache fsevents optional in lockfile"
          git push origin "HEAD:audit-repair/phases-1-3-v1"
      - name: Verify corrected lockfile installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run all unit and security tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run lint
      - name: Enforce Audit and Lite boundary
        run: npm run audit:boundary
      - name: Build separate Audit web assets
        run: node scripts/build-audit.mjs
