name: Test CurveYield Audit Phase 1

on:
  pull_request:
    paths:
      - "apps/audit-*/**"
      - "packages/audit-*/**"
      - "infra/audit-cloudflare/**"
      - "docs/audit/**"
      - "scripts/build-audit.mjs"
      - "scripts/check-audit-boundary.mjs"
      - "test/audit-*.test.mjs"
      - "test/boundary/**"
      - ".github/workflows/audit-*.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - "audit-phase1/**"

permissions:
  contents: read

concurrency:
  group: curveyield-audit-phase1-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install lockfile-pinned trusted dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run all unit and security tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run lint
      - name: Enforce Audit and Lite boundary
        run: npm run audit:boundary
      - name: Build separate Audit web assets
        run: node scripts/build-audit.mjs
