name: Temporary Compile CurveYield V27 v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'jobs/compile-curveyield-v27-v1/source-payloads/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact staged source payloads
        uses: actions/checkout@v4
        with:
          ref: automation/compile-curveyield-v27-v1
          persist-credentials: true

      - name: Reconstruct and verify exact Solidity sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p jobs/compile-curveyield-v27-v1/contracts
          cat jobs/compile-curveyield-v27-v1/source-payloads/archive/v27-sources.tar.gz.part-*.b64 > /tmp/v27-sources.tar.gz.b64
          base64 -d /tmp/v27-sources.tar.gz.b64 > /tmp/v27-sources.tar.gz
          echo '4ac83fac16a6005a9517775edc19f8997e2a6752f8ad94d2c7442eee0babbb59  /tmp/v27-sources.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v27-sources.tar.gz -C jobs/compile-curveyield-v27-v1/contracts
          echo 'c3c009179c53a9b5953f090ab8fd47528e392044b65c73006d229eeed8dd69c2  jobs/compile-curveyield-v27-v1/contracts/CurveYieldSdYBHybridVaultV27.sol' | sha256sum -c -
          echo '8d5db62b021d152c48fde77cb426d22e1948a3208f169586cf91d07f0ad89a04  jobs/compile-curveyield-v27-v1/contracts/CurveYieldSdYBTwoDestinationStrategyV27.sol' | sha256sum -c -

      - name: Build standard JSON compiler input
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('jobs/compile-curveyield-v27-v1/contracts')
          sources = {path.name: {'content': path.read_text(encoding='utf-8')} for path in sorted(root.glob('*.sol'))}
          compiler_input = {
              'language': 'Solidity',
              'sources': sources,
              'settings': {
                  'optimizer': {'enabled': True, 'runs': 200},
                  'viaIR': True,
                  'outputSelection': {'*': {'*': [
                      'abi', 'metadata', 'storageLayout', 'evm.bytecode.object',
                      'evm.deployedBytecode.object', 'evm.methodIdentifiers'
                  ]}}
              }
          }
          Path('compiler-input.json').write_text(json.dumps(compiler_input), encoding='utf-8')
          PY

      - name: Compile with official Solidity 0.8.28 image
        shell: bash
        run: docker run --rm -i ethereum/solc:0.8.28 --standard-json < compiler-input.json > compiler-output.json

      - name: Extract artifacts and contract sizes
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          output = json.loads(Path('compiler-output.json').read_text(encoding='utf-8'))
          diagnostics = output.get('errors', [])
          errors = [d for d in diagnostics if d.get('severity') == 'error']
          if errors:
              for item in errors:
                  print(item.get('formattedMessage') or item.get('message'), file=sys.stderr)
              sys.exit(1)
          targets = {
              'CurveYieldSdYBHybridVaultV27.sol': 'CurveYieldSdYBHybridVaultV27',
              'CurveYieldSdYBTwoDestinationStrategyV27.sol': 'CurveYieldSdYBTwoDestinationStrategyV27'
          }
          out_dir = Path('jobs/compile-curveyield-v27-v1/compiled')
          out_dir.mkdir(parents=True, exist_ok=True)
          sizes = []
          for source_name, contract_name in targets.items():
              artifact = output['contracts'][source_name][contract_name]
              creation = artifact['evm']['bytecode']['object']
              runtime = artifact['evm']['deployedBytecode']['object']
              record = {
                  'sourceName': source_name,
                  'contractName': contract_name,
                  'compilerVersion': '0.8.28',
                  'optimizer': {'enabled': True, 'runs': 200},
                  'viaIR': True,
                  'creationBytecodeBytes': len(creation) // 2,
                  'deployedBytecodeBytes': len(runtime) // 2,
                  'eip170LimitBytes': 24576,
                  'eip170RemainingBytes': 24576 - len(runtime) // 2
              }
              sizes.append(record)
              normalized = {
                  'sourceName': source_name,
                  'contractName': contract_name,
                  'abi': artifact.get('abi', []),
                  'metadata': artifact.get('metadata'),
                  'storageLayout': artifact.get('storageLayout'),
                  'methodIdentifiers': artifact.get('evm', {}).get('methodIdentifiers', {}),
                  'bytecode': '0x' + creation,
                  'deployedBytecode': '0x' + runtime,
                  'compiler': {'version': '0.8.28', 'optimizer': {'enabled': True, 'runs': 200}, 'viaIR': True}
              }
              (out_dir / f'{contract_name}.json').write_text(json.dumps(normalized, indent=2), encoding='utf-8')
              (out_dir / f'{contract_name}.abi.json').write_text(json.dumps(artifact.get('abi', []), indent=2), encoding='utf-8')
              (out_dir / f'{contract_name}.bin').write_text(creation + '\n', encoding='utf-8')
              (out_dir / f'{contract_name}.deployed.bin').write_text(runtime + '\n', encoding='utf-8')
          (out_dir / 'contract-sizes-v1.json').write_text(json.dumps(sizes, indent=2), encoding='utf-8')
          lines = [
              '# CurveYield V27 Non-Converter Contract Sizes v1', '',
              'Compiler: Solidity 0.8.28; optimizer enabled, 200 runs; viaIR enabled.', '',
              '| Contract | Creation bytecode | Deployed bytecode | EIP-170 remaining |',
              '|---|---:|---:|---:|'
          ]
          for item in sizes:
              lines.append(f"| {item['contractName']} | {item['creationBytecodeBytes']:,} bytes | {item['deployedBytecodeBytes']:,} bytes | {item['eip170RemainingBytes']:,} bytes |")
          (out_dir / 'contract-sizes-v1.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (out_dir / 'compiler-diagnostics-v1.json').write_text(json.dumps(diagnostics, indent=2), encoding='utf-8')
          (out_dir / 'compiler-input-v1.json').write_text(Path('compiler-input.json').read_text(encoding='utf-8'), encoding='utf-8')
          (out_dir / 'compiler-output-v1.json').write_text(Path('compiler-output.json').read_text(encoding='utf-8'), encoding='utf-8')
          PY

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CurveYield-V27-non-converter-compiled-contracts-v1
          path: jobs/compile-curveyield-v27-v1/compiled
          if-no-files-found: error
          retention-days: 7

      - name: Commit compiled artifacts to isolated branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jobs/compile-curveyield-v27-v1/contracts jobs/compile-curveyield-v27-v1/compiled
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: add CurveYield V27 non-converter artifacts v1'
          git push origin HEAD:automation/compile-curveyield-v27-v1
