name: Tier 3 Release Verification v1

on:
  push:
    branches:
      - orchestrator/round4-ci-base-v1
    paths:
      - .github/workflows/tier3-release-verification-v1.yml
      - .github/workflows/tier3-production-deploy-v4.yml
      - apps/api/src/controller-adapter-v2.mjs
      - apps/api/src/controller-command-adapter-v2.mjs
      - apps/api/src/entry.mjs
      - apps/api/wrangler.toml
      - apps/api/test/controller-adapter-v3.test.mjs
      - apps/api/test/controller-command-adapter-v2.test.mjs
      - apps/api/test/controller-entry-v3.test.mjs
      - apps/web/src/client.mjs
      - apps/web/src/controller-detail-model-v2.mjs
      - apps/web/src/controller-view-v3.mjs
      - apps/web/test/controller-detail-model-v2.test.mjs
      - apps/web/test/controller-view-v3.test.mjs
      - apps/web/test/tier3-clean-shell-v3.test.mjs
      - apps/web/test/tier3-client-v1.test.mjs
      - apps/web/tier3/**
      - packages/protocol/src/tier3-controller-v3.mjs
      - packages/protocol/test/tier3-controller-v3.test.mjs
      - packages/runner/test/audit-round5-tier3-clean-build-v3.test.mjs
      - packages/runner/test/audit-round5-tier3-production-deploy-v4.test.mjs
      - packages/runner/test/audit-round5-tier3-release-verification-v1.test.mjs
      - scripts/build.mjs
      - docs/setup.md

permissions:
  contents: read
  issues: write

concurrency:
  group: tier3-release-verification-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  no-install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact merged release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Enforce accepted Lite and API-core boundary
        shell: bash
        run: |
          set -euo pipefail
          accepted=2df81aacb6f5747f06b49297e89e02c3f013d4ef
          git cat-file -e "$accepted^{commit}"
          git diff --exit-code "$accepted" -- apps/web/public apps/api/src/index.mjs
          grep -F 'ENABLED_CHAINS = "ethereum,base"' apps/api/wrangler.toml >/dev/null
          grep -F 'AUDIT_CONTROLLER_INTAKE_ISSUE = "64"' apps/api/wrangler.toml >/dev/null

      - name: Run current Deep Assurance 16.14 dependency-free verification
        run: |
          node --test \
            packages/protocol/test/tier3-controller-v3.test.mjs \
            apps/api/test/controller-adapter-v3.test.mjs \
            apps/api/test/controller-command-adapter-v2.test.mjs \
            apps/api/test/controller-entry-v3.test.mjs \
            apps/web/test/tier3-client-v1.test.mjs \
            apps/web/test/controller-view-v3.test.mjs \
            apps/web/test/controller-detail-model-v2.test.mjs \
            apps/web/test/tier3-clean-shell-v3.test.mjs \
            packages/runner/test/audit-round5-tier3-clean-build-v3.test.mjs \
            packages/runner/test/audit-round5-tier3-production-deploy-v4.test.mjs \
            packages/runner/test/audit-round5-tier3-release-verification-v1.test.mjs

      - name: Check current Tier 3 JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check packages/protocol/src/tier3-controller-v3.mjs
          node --check apps/api/src/controller-adapter-v2.mjs
          node --check apps/api/src/controller-command-adapter-v2.mjs
          node --check apps/api/src/entry.mjs
          node --check apps/web/src/client.mjs
          node --check apps/web/src/controller-view-v3.mjs
          node --check apps/web/src/controller-detail-model-v2.mjs
          node --check apps/web/tier3/app.js
          node --check scripts/build.mjs

      - name: Publish dependency-free release receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          result=FAIL
          [[ "$JOB_STATUS" == success ]] && result=PASS
          gh issue comment 173 --repo "$GITHUB_REPOSITORY" --body "## Tier 3 Release Verification v1 — no-install

- result: \`$result\`
- run: \`$GITHUB_RUN_ID\`
- exact merged release SHA: \`$GITHUB_SHA\`
- accepted-Lite/API-core boundary: \`$JOB_STATUS\`
- current Deep Assurance release: \`16.14.0\`
- controller adapter: \`tier3-controller-adapter-v2\`
- dependency installation/download: \`NO\`
- Cloudflare deployment: \`NO\`
- controller mailbox mutation: \`NO\`
- wallet signing/public broadcast: \`NO\`"

  authorized-build:
    needs: no-install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact merged release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Re-enforce accepted Lite and API-core boundary
        shell: bash
        run: |
          set -euo pipefail
          accepted=2df81aacb6f5747f06b49297e89e02c3f013d4ef
          git diff --exit-code "$accepted" -- apps/web/public apps/api/src/index.mjs

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install account-owner-authorized pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run full repository test suite
        run: npm test

      - name: Run JavaScript syntax lint
        run: npm run lint

      - name: Build static browser surfaces
        run: npm run build

      - name: Re-verify exact current dual-surface build
        run: node --test packages/runner/test/audit-round5-tier3-clean-build-v3.test.mjs

      - name: Publish authorized build receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          result=FAIL
          [[ "$JOB_STATUS" == success ]] && result=PASS
          gh issue comment 173 --repo "$GITHUB_REPOSITORY" --body "## Tier 3 Release Verification v1 — authorized build

- result: \`$result\`
- run: \`$GITHUB_RUN_ID\`
- exact merged release SHA: \`$GITHUB_SHA\`
- dependency installation: \`AUTHORIZED / npm install --ignore-scripts --no-audit --no-fund\`
- full repository tests: \`$JOB_STATUS\`
- JavaScript syntax lint: \`$JOB_STATUS\`
- static dual-surface build: \`$JOB_STATUS\`
- explicit Foundry/Hardhat/Forge/solc command: \`NO\`
- Cloudflare deployment: \`NO\`
- controller mailbox mutation: \`NO\`
- wallet signing/public broadcast: \`NO\`"
