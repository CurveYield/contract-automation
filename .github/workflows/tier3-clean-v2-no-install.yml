name: Tier 3 Clean v2 No-Install Verification

on:
  push:
    branches:
      - audit-round5/tier3-controller-ui-v2
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tier3-clean-v2-no-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Enforce clean-v2 boundary
        id: boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -d node_modules
          base=2df81aacb6f5747f06b49297e89e02c3f013d4ef
          git merge-base --is-ancestor "$base" HEAD
          git diff --exit-code "$base" -- apps/web/public apps/api/src/index.mjs
          workflow=.github/workflows/tier3-clean-v2-no-install.yml
          ! grep -Eq '^[[:space:]]*(npm[[:space:]]+(install|ci)|pnpm([[:space:]]|$)|yarn([[:space:]]|$)|npx([[:space:]]|$)|forge([[:space:]]|$)|hardhat([[:space:]]|$)|solc([[:space:]]|$)|wrangler([[:space:]]|$))' "$workflow"

      - name: Protocol compatibility
        id: protocol
        continue-on-error: true
        run: node --test packages/protocol/test/tier3-controller-v1.test.mjs

      - name: Read adapter
        id: read_adapter
        continue-on-error: true
        run: node --test apps/api/test/controller-adapter-v1.test.mjs

      - name: Command adapter
        id: command_adapter
        continue-on-error: true
        run: node --test apps/api/test/controller-command-adapter-v1.test.mjs

      - name: Controller entry v2
        id: entry
        continue-on-error: true
        run: node --test apps/api/test/controller-entry-v2.test.mjs

      - name: Browser client
        id: client
        continue-on-error: true
        run: node --test apps/web/test/tier3-client-v1.test.mjs

      - name: Browser presenter
        id: view
        continue-on-error: true
        run: node --test apps/web/test/controller-view-v1.test.mjs

      - name: Detail model
        id: detail
        continue-on-error: true
        run: node --test apps/web/test/controller-detail-model-v1.test.mjs apps/web/test/controller-detail-model-diagnostic-v1.test.mjs

      - name: Clean browser shell
        id: shell
        continue-on-error: true
        run: node --test apps/web/test/tier3-clean-shell-v2.test.mjs

      - name: Dual-surface build
        id: build
        continue-on-error: true
        run: node --test packages/runner/test/audit-round5-tier3-clean-build-v2.test.mjs

      - name: Production deployment static contract
        id: deploy_static
        continue-on-error: true
        run: node --test packages/runner/test/audit-round5-tier3-production-deploy-v2.test.mjs

      - name: JavaScript syntax
        id: syntax
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/api/src/controller-adapter-v1.mjs
          node --check apps/api/src/controller-command-adapter-v1.mjs
          node --check apps/api/src/entry.mjs
          node --check apps/web/src/client.mjs
          node --check apps/web/src/controller-view-v2.mjs
          node --check apps/web/src/controller-detail-model-v1.mjs
          node --check apps/web/tier3/app.js
          node --check scripts/build.mjs

      - name: Enforce verification set
        id: enforce
        shell: bash
        env:
          PROTOCOL: ${{ steps.protocol.outcome }}
          READ_ADAPTER: ${{ steps.read_adapter.outcome }}
          COMMAND_ADAPTER: ${{ steps.command_adapter.outcome }}
          ENTRY: ${{ steps.entry.outcome }}
          CLIENT: ${{ steps.client.outcome }}
          VIEW: ${{ steps.view.outcome }}
          DETAIL: ${{ steps.detail.outcome }}
          SHELL: ${{ steps.shell.outcome }}
          BUILD: ${{ steps.build.outcome }}
          DEPLOY_STATIC: ${{ steps.deploy_static.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
        run: |
          set -euo pipefail
          for outcome in "$PROTOCOL" "$READ_ADAPTER" "$COMMAND_ADAPTER" "$ENTRY" "$CLIENT" "$VIEW" "$DETAIL" "$SHELL" "$BUILD" "$DEPLOY_STATIC" "$SYNTAX"; do
            test "$outcome" = success
          done

      - name: Publish sanitized v2 receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOUNDARY: ${{ steps.boundary.outcome }}
          PROTOCOL: ${{ steps.protocol.outcome }}
          READ_ADAPTER: ${{ steps.read_adapter.outcome }}
          COMMAND_ADAPTER: ${{ steps.command_adapter.outcome }}
          ENTRY: ${{ steps.entry.outcome }}
          CLIENT: ${{ steps.client.outcome }}
          VIEW: ${{ steps.view.outcome }}
          DETAIL: ${{ steps.detail.outcome }}
          SHELL: ${{ steps.shell.outcome }}
          BUILD: ${{ steps.build.outcome }}
          DEPLOY_STATIC: ${{ steps.deploy_static.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
          ENFORCE: ${{ steps.enforce.outcome }}
        run: |
          set -euo pipefail
          overall=PASS
          if [[ "$BOUNDARY" != success || "$ENFORCE" != success ]]; then overall=FAIL; fi
          receipt=$(cat <<EOF
          ## Tier 3 Clean v2 No-Install Verification

          - result: \`$overall\`
          - run: \`$GITHUB_RUN_ID\`
          - source SHA: \`$GITHUB_SHA\`
          - branch: \`audit-round5/tier3-controller-ui-v2\`
          - accepted-Lite boundary: \`$BOUNDARY\`
          - protocol: \`$PROTOCOL\`
          - read adapter: \`$READ_ADAPTER\`
          - command adapter: \`$COMMAND_ADAPTER\`
          - controller entry: \`$ENTRY\`
          - browser client: \`$CLIENT\`
          - browser presenter: \`$VIEW\`
          - detail model: \`$DETAIL\`
          - clean shell: \`$SHELL\`
          - dual-surface build: \`$BUILD\`
          - production deployment static: \`$DEPLOY_STATIC\`
          - JavaScript syntax: \`$SYNTAX\`
          - dependency installation/download: \`NO\`
          - Cloudflare deployment/controller mutation: \`NO\`
          EOF
          )
          gh issue comment 170 --repo "$GITHUB_REPOSITORY" --body "$receipt"
