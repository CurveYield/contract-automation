name: Dry Run CurveYield Audit Deployment

on:
  pull_request:
    paths:
      - "apps/audit-*/**"
      - "packages/audit-*/**"
      - "infra/audit-cloudflare/**"
      - "scripts/build-audit.mjs"
      - "scripts/check-audit-boundary.mjs"
      - "test/boundary/**"
      - ".github/workflows/audit-deploy-dry-run.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curveyield-audit-deploy-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install lockfile-pinned trusted dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run tests and syntax checks
        run: npm test && npm run lint
      - name: Enforce Audit and Lite boundary
        run: npm run audit:boundary
      - name: Build separate Audit web assets
        run: node scripts/build-audit.mjs
      - name: Bundle Audit Worker without deployment
        run: npx wrangler deploy --dry-run --outdir dist/audit-worker --config apps/audit-api/wrangler.toml
