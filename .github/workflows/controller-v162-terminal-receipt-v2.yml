name: Deep Assurance v16.2 Controller Terminal Receipt v2

on:
  push:
    branches:
      - rehearsal/controller-v162-byte-exact-harness-v1
    paths:
      - .github/workflows/controller-v162-terminal-receipt-v2.yml

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TERMINAL_COMMIT: f27b9691bb0b439aa1c8e80a8a016423542becd7
      EXPECTED_WORKFLOW: Deep Assurance v16.2 vlSDT Controller Terminal Rehearsal v1
      EXPECTED_ARTIFACT: vlsdt-v18-9-controller-terminal-v1
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Verify terminal workflow run and artifact
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")
          runs="$(curl --fail --silent --show-error "${auth[@]}" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TERMINAL_COMMIT&event=push&per_page=100")"
          run_id="$(printf '%s' "$runs" | jq -r --arg name "$EXPECTED_WORKFLOW" --arg sha "$TERMINAL_COMMIT" '.workflow_runs[] | select(.name == $name and .head_sha == $sha) | .id' | head -n1)"
          test -n "$run_id"
          conclusion="$(printf '%s' "$runs" | jq -r --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .conclusion')"
          test "$conclusion" = success
          artifacts="$(curl --fail --silent --show-error "${auth[@]}" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
          artifact_id="$(printf '%s' "$artifacts" | jq -r --arg name "$EXPECTED_ARTIFACT" '.artifacts[] | select(.name == $name and .expired == false) | .id' | head -n1)"
          test -n "$artifact_id"
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          node --input-type=module <<'NODE'
          const body = {
            state: 'success',
            context: 'deep-assurance/controller-terminal-v1',
            description: 'v16.2 reducer terminalized COMPLETE + NO_GO',
            target_url: process.env.RUN_URL,
          };
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.TERMINAL_COMMIT}`, {
            method: 'POST',
            headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              'content-type': 'application/json',
              'user-agent': 'curveyield-controller-terminal-receipt-v2',
              'x-github-api-version': '2022-11-28',
            },
            body: JSON.stringify(body),
          });
          if (!response.ok) throw new Error(`status publication failed: ${response.status} ${await response.text()}`);
          NODE
        env:
          RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, 'REPLACED_IN_SHELL') }}
