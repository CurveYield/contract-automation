name: Temporary RPC Policy Verification v2

on:
  push:
    branches:
      - agent/fail-closed-rpc-method-policy-v2
    paths:
      - '.github/workflows/temp-rpc-policy-verify-v2.yml'

permissions:
  contents: write

concurrency:
  group: temp-rpc-policy-verify-v2
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fail-closed-rpc-method-policy-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run focused dependency-free tests
        run: >-
          node --test
          packages/runner/test/rpc-method-policy.test.mjs
          packages/runner/test/fork-rpc-guard.test.mjs
          packages/runner/test/rpc-policy-termination.test.mjs
          packages/github-native-sim/test/fork-rpc-policy.test.mjs
      - name: Check modified JavaScript syntax
        run: |
          node --check packages/runner/src/rpc-method-policy.mjs
          node --check packages/runner/src/fork-rpc-guard.mjs
          node --check packages/runner/src/run-job.mjs
          node --check packages/github-native-sim/src/fork-rpc-proxy.mjs
          node --check packages/github-native-sim/src/run-job-file.mjs
      - name: Publish verification receipt
        env:
          VERIFIED_SHA: ${{ github.sha }}
          VERIFIED_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p docs/verification
          cat > docs/verification/2026-08-01-rpc-policy-verification-v2.json <<JSON
          {
            "version": "rpc-policy-verification/v2",
            "verifiedCommit": "$VERIFIED_SHA",
            "workflowRunId": "$VERIFIED_RUN_ID",
            "focusedNodeTests": "passed",
            "javascriptSyntax": "passed",
            "dependenciesInstalled": false,
            "solidityCompiled": false
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/2026-08-01-rpc-policy-verification-v2.json
          git commit -m 'Record RPC policy verification v2'
          git push origin HEAD:agent/fail-closed-rpc-method-policy-v2
