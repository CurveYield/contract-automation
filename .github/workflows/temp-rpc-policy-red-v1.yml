name: Temporary RPC Policy RED v1

on:
  push:
    branches:
      - agent/fail-closed-rpc-method-policy-v1

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dependency-free policy tests
        run: >-
          node --test
          packages/runner/test/rpc-method-policy.test.mjs
          packages/runner/test/fork-rpc-guard.test.mjs
          packages/runner/test/rpc-policy-termination.test.mjs
          packages/github-native-sim/test/fork-rpc-policy.test.mjs
