name: Tier 3 Production Deploy v2

on:
  push:
    branches:
      - orchestrator/round4-ci-base-v1
    paths:
      - .agent-control/v1/orchestrator/TIER3_PRODUCTION_DEPLOY_REQUEST_v2.json

permissions:
  contents: read
  issues: write

concurrency:
  group: curveyield-tier3-production-deploy-v2
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    if: ${{ github.ref == 'refs/heads/orchestrator/round4-ci-base-v1' && github.event_name == 'push' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_BRANCH: orchestrator/round4-ci-base-v1
      REQUEST_PATH: .agent-control/v1/orchestrator/TIER3_PRODUCTION_DEPLOY_REQUEST_v2.json
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREFLIGHTSIM_CLIENT_API_KEY: ${{ secrets.PREFLIGHTSIM_CLIENT_API_KEY }}
      PREFLIGHTSIM_GPT_API_KEY: ${{ secrets.PREFLIGHTSIM_GPT_API_KEY }}
      PREFLIGHTSIM_GITHUB_BRIDGE_API_KEY: ${{ secrets.PREFLIGHTSIM_GITHUB_BRIDGE_API_KEY }}
      PREFLIGHTSIM_RUNNER_API_KEY: ${{ secrets.PREFLIGHTSIM_RUNNER_API_KEY }}
      PREFLIGHTSIM_GITHUB_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
      PREFLIGHTSIM_AUDIT_CONTROLLER_GITHUB_TOKEN: ${{ secrets.PREFLIGHTSIM_AUDIT_CONTROLLER_GITHUB_TOKEN }}
      PREFLIGHTSIM_R2_ACCESS_KEY_ID: ${{ secrets.PREFLIGHTSIM_R2_ACCESS_KEY_ID }}
      PREFLIGHTSIM_R2_SECRET_ACCESS_KEY: ${{ secrets.PREFLIGHTSIM_R2_SECRET_ACCESS_KEY }}
      RPC_ETHEREUM: ${{ secrets.RPC_ETHEREUM }}
      RPC_BASE: ${{ secrets.RPC_BASE }}
      PREFLIGHTSIM_API_URL: ${{ vars.PREFLIGHTSIM_API_URL }}
      PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
      PREFLIGHTSIM_ALLOWED_GITHUB_USERS: ${{ vars.PREFLIGHTSIM_ALLOWED_GITHUB_USERS }}
      PAGES_DOMAIN: preflight.curveyield.online
      R2_BUCKET_NAME: curveyield-preflight
    steps:
      - name: Check out exact request commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Validate one-shot Tier 3 deployment authorization
        shell: bash
        env:
          DEPLOY_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test -f "$REQUEST_PATH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/$RELEASE_BRANCH"
          expected_before=$(jq -r '.expectedBeforeSha' "$REQUEST_PATH")
          test "$DEPLOY_EVENT_BEFORE" = "$expected_before"
          test "$(git rev-parse HEAD^)" = "$expected_before"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg release_branch "$RELEASE_BRANCH" \
            '
              .schemaVersion == "round5-tier3-production-deploy-request-v2" and
              .repository == $repository and
              .releaseBranch == $release_branch and
              .requestedBy == "account-owner-through-orchestrator" and
              .deploymentAuthorized == true and
              .dependencyInstallationAuthorized == true and
              .activeNetworks == ["ethereum", "base"] and
              .walletSigningAllowed == false and
              .publicTransactionBroadcastAllowed == false and
              .controllerRepository == "CurveYield/audit-controller" and
              .controllerSecretName == "PREFLIGHTSIM_AUDIT_CONTROLLER_GITHUB_TOKEN" and
              (.expectedBeforeSha | test("^[0-9a-f]{40}$")) and
              (.requestedAt | type == "string")
            ' "$REQUEST_PATH" >/dev/null

      - name: Verify required production configuration names
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            PREFLIGHTSIM_CLIENT_API_KEY \
            PREFLIGHTSIM_GPT_API_KEY \
            PREFLIGHTSIM_GITHUB_BRIDGE_API_KEY \
            PREFLIGHTSIM_RUNNER_API_KEY \
            PREFLIGHTSIM_GITHUB_TOKEN \
            PREFLIGHTSIM_AUDIT_CONTROLLER_GITHUB_TOKEN \
            PREFLIGHTSIM_R2_ACCESS_KEY_ID \
            PREFLIGHTSIM_R2_SECRET_ACCESS_KEY \
            RPC_ETHEREUM \
            RPC_BASE \
            PREFLIGHTSIM_API_URL \
            PAGES_PROJECT_NAME \
            PREFLIGHTSIM_ALLOWED_GITHUB_USERS; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required production configuration name: %s\n' "${missing[@]}"
            exit 1
          fi
          test "$PREFLIGHTSIM_API_URL" = "https://api.preflight.curveyield.online"
          test "$PAGES_PROJECT_NAME" = "curveyield-preflight"

      - name: Verify accepted Lite source remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          accepted=2df81aacb6f5747f06b49297e89e02c3f013d4ef
          git cat-file -e "$accepted^{commit}"
          git diff --exit-code "$accepted" -- apps/web/public apps/api/src/index.mjs
          grep -F 'ENABLED_CHAINS = "ethereum,base"' apps/api/wrangler.toml >/dev/null
          grep -F 'AUDIT_CONTROLLER_INTAKE_ISSUE = "64"' apps/api/wrangler.toml >/dev/null

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install pinned trusted dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run repository tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run lint

      - name: Build Tier 3 root and accepted Lite execution subtree
        run: npm run build

      - name: Verify dual-surface build contract
        run: node --test packages/runner/test/audit-round5-tier3-clean-build-v2.test.mjs apps/web/test/tier3-clean-shell-v2.test.mjs

      - name: Create R2 bucket when missing
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output=$(npx --no-install wrangler r2 bucket create "$R2_BUCKET_NAME" 2>&1)
          status=$?
          set -e
          if (( status != 0 )) && ! grep -qi "already exists" <<<"$output"; then
            echo "R2 bucket provisioning failed"
            exit 1
          fi

      - name: Configure bounded R2 uploads and retention
        run: |
          npx --no-install wrangler r2 bucket cors set "$R2_BUCKET_NAME" --file infra/r2-cors.json
          npx --no-install wrangler r2 bucket lifecycle set "$R2_BUCKET_NAME" --file infra/r2-lifecycle.json --force

      - name: Create or update Worker before secret bulk upload
        run: npx --no-install wrangler deploy --config apps/api/wrangler.toml

      - name: Upload Worker secrets without logging values
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secrets_file=$(mktemp)
          trap 'rm -f "$secrets_file"' EXIT
          jq -n \
            --arg CLIENT_API_KEY "$PREFLIGHTSIM_CLIENT_API_KEY" \
            --arg GPT_API_KEY "$PREFLIGHTSIM_GPT_API_KEY" \
            --arg GITHUB_BRIDGE_API_KEY "$PREFLIGHTSIM_GITHUB_BRIDGE_API_KEY" \
            --arg RUNNER_API_KEY "$PREFLIGHTSIM_RUNNER_API_KEY" \
            --arg GITHUB_TOKEN "$PREFLIGHTSIM_GITHUB_TOKEN" \
            --arg AUDIT_CONTROLLER_GITHUB_TOKEN "$PREFLIGHTSIM_AUDIT_CONTROLLER_GITHUB_TOKEN" \
            --arg R2_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID" \
            --arg R2_ACCESS_KEY_ID "$PREFLIGHTSIM_R2_ACCESS_KEY_ID" \
            --arg R2_SECRET_ACCESS_KEY "$PREFLIGHTSIM_R2_SECRET_ACCESS_KEY" \
            --arg ALLOWED_GITHUB_USERS "$PREFLIGHTSIM_ALLOWED_GITHUB_USERS" \
            '{CLIENT_API_KEY:$CLIENT_API_KEY,GPT_API_KEY:$GPT_API_KEY,GITHUB_BRIDGE_API_KEY:$GITHUB_BRIDGE_API_KEY,RUNNER_API_KEY:$RUNNER_API_KEY,GITHUB_TOKEN:$GITHUB_TOKEN,AUDIT_CONTROLLER_GITHUB_TOKEN:$AUDIT_CONTROLLER_GITHUB_TOKEN,R2_ACCOUNT_ID:$R2_ACCOUNT_ID,R2_ACCESS_KEY_ID:$R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY:$R2_SECRET_ACCESS_KEY,ALLOWED_GITHUB_USERS:$ALLOWED_GITHUB_USERS}' \
            > "$secrets_file"
          npx --no-install wrangler secret bulk "$secrets_file" --config apps/api/wrangler.toml

      - name: Redeploy Worker with final secret bindings
        run: npx --no-install wrangler deploy --config apps/api/wrangler.toml

      - name: Verify Worker health and authenticated Tier 3 API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 10 "$PREFLIGHTSIM_API_URL/api/v1/health" >/dev/null; then break; fi
            test "$attempt" -lt 12
            sleep 5
          done
          setup=$(curl --fail --silent --show-error --max-time 10 \
            --header "Authorization: Bearer $PREFLIGHTSIM_CLIENT_API_KEY" \
            "$PREFLIGHTSIM_API_URL/api/v1/setup")
          jq -e '.status == "ready" and .features.tier3Controller == true' <<<"$setup" >/dev/null
          chains=$(curl --fail --silent --show-error --max-time 10 \
            --header "Authorization: Bearer $PREFLIGHTSIM_CLIENT_API_KEY" \
            "$PREFLIGHTSIM_API_URL/api/v1/chains")
          jq -e '(.chains | keys | sort) == ["base","ethereum"]' <<<"$chains" >/dev/null
          compatibility=$(curl --fail --silent --show-error --max-time 10 \
            --header "Authorization: Bearer $PREFLIGHTSIM_CLIENT_API_KEY" \
            "$PREFLIGHTSIM_API_URL/api/v1/controller/compatibility")
          jq -e '
            .adapterVersion == "tier3-controller-adapter-v1" and
            .controller.repository == "CurveYield/audit-controller" and
            .controller.compatibilityCommit == "d4851886ece3e8793dcc2a99f97f6d34da10e1cd" and
            .controller.instructionReleaseIdentity == "ai-auditor-deep-assurance-v6@16.13.0" and
            .networkScope.chains == ["ethereum","base"] and
            .networkScope.defaultChain == "base"
          ' <<<"$compatibility" >/dev/null

      - name: Create Pages project when missing
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output=$(npx --no-install wrangler pages project create "$PAGES_PROJECT_NAME" --production-branch="$RELEASE_BRANCH" 2>&1)
          status=$?
          set -e
          if (( status != 0 )) && ! grep -Eqi "already exists|already been taken" <<<"$output"; then
            echo "Pages project provisioning failed"
            exit 1
          fi

      - name: Deploy Pages from exact trusted request commit
        run: npx --no-install wrangler pages deploy dist/web --project-name="$PAGES_PROJECT_NAME" --branch="$RELEASE_BRANCH"

      - name: Ensure Pages custom domain is attached
        shell: bash
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          status=$(curl --silent --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT_NAME/domains/$PAGES_DOMAIN")
          if [[ "$status" == "404" ]]; then
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "{\"name\":\"$PAGES_DOMAIN\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT_NAME/domains" >/dev/null
          elif (( status >= 400 )); then
            echo "Pages custom-domain verification failed with HTTP status $status"
            exit 1
          fi

      - name: Verify production Pages root, Lite execution subtree, and CORS
        shell: bash
        run: |
          set -euo pipefail
          root_file=$(mktemp)
          execution_file=$(mktemp)
          headers_file=$(mktemp)
          trap 'rm -f "$root_file" "$execution_file" "$headers_file"' EXIT
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 10 "https://preflight.curveyield.online/" >"$root_file" \
              && grep -F 'Deep Assurance' "$root_file" >/dev/null \
              && curl --fail --silent --show-error --max-time 10 "https://preflight.curveyield.online/execution/" >"$execution_file" \
              && grep -F 'PreflightSim Lite' "$execution_file" >/dev/null; then
              break
            fi
            test "$attempt" -lt 12
            sleep 5
          done
          curl --fail --silent --show-error --max-time 10 -D "$headers_file" -o /dev/null \
            --request OPTIONS \
            --header 'Origin: https://preflight.curveyield.online' \
            --header 'Access-Control-Request-Method: GET' \
            "$PREFLIGHTSIM_API_URL/api/v1/controller/compatibility"
          grep -Eqi '^access-control-allow-origin:[[:space:]]*https://preflight\.curveyield\.online' "$headers_file"

      - name: Publish sanitized Tier 3 deployment receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          result=FAIL
          if [[ "$JOB_STATUS" == success ]]; then result=PASS; fi
          receipt=$(cat <<EOF
          ## Tier 3 Production Deployment v2

          - result: \`$result\`
          - run: \`$GITHUB_RUN_ID\`
          - exact source SHA: \`$GITHUB_SHA\`
          - release branch: \`$RELEASE_BRANCH\`
          - Pages project: \`$PAGES_PROJECT_NAME\`
          - Worker: \`curveyield-preflight\`
          - controller adapter: \`tier3-controller-adapter-v1\`
          - controller compatibility commit: \`d4851886ece3e8793dcc2a99f97f6d34da10e1cd\`
          - instruction release: \`ai-auditor-deep-assurance-v6@16.13.0\`
          - active networks: \`["ethereum", "base"]\`
          - root surface: \`Deep Assurance\`
          - execution surface: \`PreflightSim Lite at /execution/\`
          - dependency installation: \`AUTHORIZED / ATTEMPTED IN THIS RUN\`
          - wallet signing: \`NO\`
          - public transaction broadcast: \`NO\`
          EOF
          )
          gh issue comment 170 --repo "$GITHUB_REPOSITORY" --body "$receipt"
