name: PR126 Security Repair CI

on:
  push:
    branches:
      - orchestrator/pr126-security-reconciliation-v1

permissions:
  contents: read

jobs:
  workflow-trust-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Run workflow trust gate
        run: node --test test/pr126-workflow-trust-v1.test.mjs
