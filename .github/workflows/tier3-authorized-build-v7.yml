name: Tier 3 Authorized Build Verification v7

on:
  push:
    branches:
      - audit-round5/tier3-controller-ui-v2

permissions:
  contents: read
  issues: write

concurrency:
  group: tier3-authorized-build-v7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Enforce authorized verification boundary
        shell: bash
        run: |
          set -euo pipefail
          base=2df81aacb6f5747f06b49297e89e02c3f013d4ef
          git merge-base --is-ancestor "$base" HEAD
          git diff --exit-code "$base" -- apps/web/public apps/api/src/index.mjs
          workflow=.github/workflows/tier3-authorized-build-v7.yml
          ! grep -Eq '^[[:space:]]+(forge([[:space:]]|$)|hardhat([[:space:]]|$)|solc([[:space:]]|$)|wrangler([[:space:]]|$)|npx[[:space:]]+wrangler)' "$workflow"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install approved pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run current Tier 3 and accepted browser regressions
        run: |
          node --test \
            packages/protocol/test/tier3-controller-v3.test.mjs \
            apps/api/test/controller-adapter-v3.test.mjs \
            apps/api/test/controller-command-adapter-v2.test.mjs \
            apps/api/test/controller-entry-v3.test.mjs \
            apps/web/test/tier3-client-v1.test.mjs \
            apps/web/test/controller-view-v3.test.mjs \
            apps/web/test/controller-detail-model-v2.test.mjs \
            apps/web/test/tier3-clean-shell-v3.test.mjs \
            apps/web/test/client.test.mjs \
            packages/runner/test/audit-round5-tier3-clean-build-v3.test.mjs \
            packages/runner/test/audit-round5-tier3-production-deploy-v4.test.mjs
      - name: Syntax lint only
        run: npm run lint
      - name: Build static browser surfaces
        run: npm run build
      - name: Re-verify current assembled dual surface
        run: node --test packages/runner/test/audit-round5-tier3-clean-build-v3.test.mjs
      - name: Publish sanitized authorized-build receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          result=FAIL
          [[ "$JOB_STATUS" == success ]] && result=PASS
          receipt=$(cat <<EOF
          ## Tier 3 Authorized Build Verification v7
          - result: \`$result\`
          - run: \`$GITHUB_RUN_ID\`
          - source SHA: \`$GITHUB_SHA\`
          - dependency installation: \`AUTHORIZED / npm install --ignore-scripts --no-audit --no-fund\`
          - current 16.14 Tier 3 + accepted browser regressions: \`$JOB_STATUS\`
          - JavaScript syntax lint: \`$JOB_STATUS\`
          - static build: \`$JOB_STATUS\`
          - production deployment v4 static contract: \`INCLUDED\`
          - explicit Solidity/Foundry/Hardhat compilation command: \`NO\`
          - Cloudflare deployment: \`NO\`
          - controller mailbox mutation: \`NO\`
          - wallet/signing/broadcast: \`NO\`
          EOF
          )
          gh issue comment 170 --repo "$GITHUB_REPOSITORY" --body "$receipt"
          gh issue comment 172 --repo "$GITHUB_REPOSITORY" --body "$receipt"
