name: Temporary V27 GitHub Suite Run v1

on:
  pull_request:
    paths:
      - 'github-native-sim/jobs/v27-functional-smoke-v3/**'
      - '.github/workflows/temp-v27-github-suite-run-v1.yml'

permissions:
  contents: read

concurrency:
  group: temp-v27-github-suite-run-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RPC_ETHEREUM: ${{ secrets.RPC_ETHEREUM }}
    steps:
      - name: Check out current upgraded suite and exact V27 job
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install trusted repository dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Reconstruct and verify exact V27 sources
        env:
          RESULT_ROOT: ${{ runner.temp }}/v27-functional-smoke-v3
        run: |
          set -euo pipefail
          job_root='github-native-sim/jobs/v27-functional-smoke-v3'
          rm -rf "$RESULT_ROOT"
          mkdir -p "$RESULT_ROOT" "$job_root/project"
          git fetch --no-tags --depth=1 origin \
            automation/v27-functional-smoke-v2:refs/remotes/origin/v27-functional-smoke-v2-source
          : > /tmp/v27-sources.tar.gz.b64
          for part in 01 02 03 04 05; do
            git show "refs/remotes/origin/v27-functional-smoke-v2-source:github-native-sim/jobs/v27-functional-smoke-v2/source-payloads/archive/v27-sources.tar.gz.part-${part}.b64" \
              >> /tmp/v27-sources.tar.gz.b64
          done
          base64 -d /tmp/v27-sources.tar.gz.b64 > /tmp/v27-sources.tar.gz
          echo '4ac83fac16a6005a9517775edc19f8997e2a6752f8ad94d2c7442eee0babbb59  /tmp/v27-sources.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v27-sources.tar.gz -C "$job_root/project"
          echo 'c3c009179c53a9b5953f090ab8fd47528e392044b65c73006d229eeed8dd69c2  github-native-sim/jobs/v27-functional-smoke-v3/project/CurveYieldSdYBHybridVaultV27.sol' | sha256sum -c -
          echo 'e8c1cd62b55986400555ac8ccb682f189304577a9fb53f26bdafccf24c09f14e  github-native-sim/jobs/v27-functional-smoke-v3/project/CurveYieldSdYBRewardConverterV27.sol' | sha256sum -c -
          echo '8d5db62b021d152c48fde77cb426d22e1948a3208f169586cf91d07f0ad89a04  github-native-sim/jobs/v27-functional-smoke-v3/project/CurveYieldSdYBTwoDestinationStrategyV27.sol' | sha256sum -c -
          cat > "$RESULT_ROOT/source-verification.json" <<'JSON'
          {
            "archiveSha256": "4ac83fac16a6005a9517775edc19f8997e2a6752f8ad94d2c7442eee0babbb59",
            "vaultSha256": "c3c009179c53a9b5953f090ab8fd47528e392044b65c73006d229eeed8dd69c2",
            "converterSha256": "e8c1cd62b55986400555ac8ccb682f189304577a9fb53f26bdafccf24c09f14e",
            "strategySha256": "8d5db62b021d152c48fde77cb426d22e1948a3208f169586cf91d07f0ad89a04",
            "verified": true
          }
          JSON

      - name: Run approved-call probe and current GitHub-native suite once
        id: execute
        env:
          JOB_ROOT: github-native-sim/jobs/v27-functional-smoke-v3
          RESULT_ROOT: ${{ runner.temp }}/v27-functional-smoke-v3
        run: |
          set -u
          mkdir -p "$RESULT_ROOT/probe" "$RESULT_ROOT/suite"

          set +e
          DRPC_URL="$RPC_ETHEREUM" node "$JOB_ROOT/trace-probe/scripts/probe-approved-calls.mjs" \
            > "$RESULT_ROOT/probe/result.json" \
            2> "$RESULT_ROOT/probe/error.log"
          probe_status=$?
          set -e

          if test "$probe_status" -ne 0; then
            PROBE_STATUS="$probe_status" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = process.env.RESULT_ROOT;
          const error = fs.readFileSync(`${root}/probe/error.log`, 'utf8');
          fs.writeFileSync(`${root}/data-report.json`, JSON.stringify({
            version: 'v27-github-suite-data-report/v1',
            status: 'failed',
            terminatedAt: 'approved-call-capability-probe',
            probeExitCode: Number(process.env.PROBE_STATUS),
            error,
            suiteStarted: false,
            retryCount: 0,
            sourceHashesVerified: true
          }, null, 2));
          NODE
            echo 'success=0' >> "$GITHUB_OUTPUT"
            echo 'phase=approved-call-capability-probe' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          node packages/github-native-sim/src/cli.mjs \
            --job "$JOB_ROOT/job.json" \
            --output "$RESULT_ROOT/suite" \
            > "$RESULT_ROOT/suite/stdout.log" \
            2> "$RESULT_ROOT/suite/stderr.log"
          suite_status=$?
          set -e

          SUITE_STATUS="$suite_status" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = process.env.RESULT_ROOT;
          const probe = JSON.parse(fs.readFileSync(`${root}/probe/result.json`, 'utf8'));
          const resultPath = `${root}/suite/result.json`;
          const suite = fs.existsSync(resultPath) ? JSON.parse(fs.readFileSync(resultPath, 'utf8')) : null;
          const stderr = fs.existsSync(`${root}/suite/stderr.log`) ? fs.readFileSync(`${root}/suite/stderr.log`, 'utf8') : '';
          const suiteExitCode = Number(process.env.SUITE_STATUS);
          fs.writeFileSync(`${root}/data-report.json`, JSON.stringify({
            version: 'v27-github-suite-data-report/v1',
            status: suiteExitCode === 0 ? 'completed' : 'failed',
            terminatedAt: suiteExitCode === 0 ? null : 'github-native-suite',
            sourceHashesVerified: true,
            retryCount: 0,
            approvedCallProbe: probe,
            suiteExitCode,
            suiteStatus: suite?.status ?? null,
            suiteError: suite?.error ?? (stderr || null),
            compilerVersion: suite?.compilerVersion ?? '0.8.28',
            resolvedBlock: suite?.resolvedBlock ?? null,
            forkTransport: suite?.forkTransport ?? null,
            deployments: suite?.deployments ?? {},
            stepCount: suite?.steps?.length ?? 0,
            steps: suite?.steps ?? []
          }, null, 2));
          NODE

          if test "$suite_status" -eq 0; then
            echo 'success=1' >> "$GITHUB_OUTPUT"
            echo 'phase=completed' >> "$GITHUB_OUTPUT"
          else
            echo 'success=0' >> "$GITHUB_OUTPUT"
            echo 'phase=github-native-suite' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload V27 data report and suite artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CurveYield-V27-GitHub-Suite-Data-Report-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/v27-functional-smoke-v3
          if-no-files-found: error
          retention-days: 30

      - name: Propagate hard termination or simulation failure
        if: steps.execute.outputs.success != '1'
        run: |
          echo "V27 run failed or terminated at: ${{ steps.execute.outputs.phase }}"
          exit 1
