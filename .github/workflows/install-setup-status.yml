name: Install setup readiness endpoint

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-setup-status.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply readiness endpoint and test
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('apps/api/src/index.mjs')
          source = api.read_text()
          old = """  if (request.method === 'GET' && path === '/api/v1/health') {
            return json({ status: 'ok', service: 'preflightsim-lite-api', version: '0.1.0' });
          }

          const internal = path.startsWith('/internal/v1/');
          """
          new = """  if (request.method === 'GET' && path === '/api/v1/health') {
            return json({ status: 'ok', service: 'preflightsim-lite-api', version: '0.1.0' });
          }
          if (request.method === 'GET' && path === '/api/v1/setup') {
            const features = {
              storage: Boolean(env.JOBS),
              browserApiAuth: Boolean(env.CLIENT_API_KEY),
              customGptAuth: Boolean(env.GPT_API_KEY),
              githubBridgeAuth: Boolean(env.GITHUB_BRIDGE_API_KEY),
              runnerAuth: Boolean(env.RUNNER_API_KEY),
              githubDispatch: Boolean(env.GITHUB_TOKEN),
              largeUploads: Boolean(env.R2_ACCOUNT_ID && env.R2_ACCESS_KEY_ID && env.R2_SECRET_ACCESS_KEY)
            };
            return json({
              status: Object.values(features).every(Boolean) ? 'ready' : 'configuration_required',
              features
            });
          }

          const internal = path.startsWith('/internal/v1/');
          """
          if new not in source:
              if old not in source:
                  raise SystemExit('Expected API insertion point not found')
              api.write_text(source.replace(old, new))

          test_file = Path('apps/api/test/api.test.mjs')
          tests = test_file.read_text()
          marker = "setup endpoint reports feature readiness without exposing secret values"
          if marker not in tests:
              tests += """

          test('setup endpoint reports feature readiness without exposing secret values', async () => {
            const env = makeEnv({
              GPT_API_KEY: undefined,
              GITHUB_BRIDGE_API_KEY: 'bridge-secret',
              R2_ACCESS_KEY_ID: undefined,
              R2_SECRET_ACCESS_KEY: undefined
            });
            const response = await worker.fetch(request('/api/v1/setup'), env);
            assert.equal(response.status, 200);
            const body = await response.json();
            assert.equal(body.status, 'configuration_required');
            assert.deepEqual(body.features, {
              storage: true,
              browserApiAuth: true,
              customGptAuth: false,
              githubBridgeAuth: true,
              runnerAuth: true,
              githubDispatch: true,
              largeUploads: false
            });
            assert.equal(JSON.stringify(body).includes('client-secret'), false);
            assert.equal(JSON.stringify(body).includes('bridge-secret'), false);
          });
          """
              test_file.write_text(tests)
          PY

      - name: Verify repository
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npm run lint
          npm run build
          git diff --check

      - name: Commit verified source and remove installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/install-setup-status.yml
          git add apps/api/src/index.mjs apps/api/test/api.test.mjs .github/workflows/install-setup-status.yml
          git commit -m "feat: expose safe runtime setup readiness"
          git push
