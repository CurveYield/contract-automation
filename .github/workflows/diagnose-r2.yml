name: Diagnose Cloudflare R2 Capability

on:
  push:
    branches:
      - orchestrator/round4-ci-base-v1
    paths:
      - .agent-control/v1/orchestrator/R2_DIAGNOSTIC_REQUEST_v1.json

permissions:
  contents: read
  issues: write

concurrency:
  group: curveyield-preflight-r2-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/orchestrator/round4-ci-base-v1' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_BRANCH: orchestrator/round4-ci-base-v1
      DIAGNOSTIC_REQUEST_PATH: .agent-control/v1/orchestrator/R2_DIAGNOSTIC_REQUEST_v1.json
      DIAGNOSTIC_REQUEST_ID: round5-r2-diagnostic-20260803T0945Z-v1
      DIAGNOSTIC_EXPECTED_BEFORE_SHA: de350bcfce68ddbdbbb88b826fdd5f7614bce69a
      R2_BUCKET_NAME: curveyield-preflight
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Verify one-time read-only diagnostic request
        shell: bash
        env:
          DIAGNOSTIC_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test "$DIAGNOSTIC_EVENT_BEFORE" = "$DIAGNOSTIC_EXPECTED_BEFORE_SHA"
          test -f "$DIAGNOSTIC_REQUEST_PATH"
          jq -e \
            --arg request_id "$DIAGNOSTIC_REQUEST_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg release_branch "$RELEASE_BRANCH" \
            --arg expected_before "$DIAGNOSTIC_EXPECTED_BEFORE_SHA" \
            --arg bucket "$R2_BUCKET_NAME" \
            '
              keys == [
                "expectedBeforeSha",
                "outputPolicy",
                "readOnly",
                "releaseBranch",
                "repository",
                "requestId",
                "requestedAt",
                "requestedBy",
                "schemaVersion",
                "targetBucketName"
              ] and
              .schemaVersion == "round5-r2-capability-diagnostic-request-v1" and
              .requestId == $request_id and
              .repository == $repository and
              .releaseBranch == $release_branch and
              .expectedBeforeSha == $expected_before and
              .targetBucketName == $bucket and
              .requestedAt == "2026-08-03T09:45:00Z" and
              .requestedBy == "orchestrator" and
              .readOnly == true and
              (.outputPolicy | keys) == [
                "errorCodesOnly",
                "messagesAllowed",
                "responseBodyAllowed",
                "secretValuesAllowed"
              ] and
              .outputPolicy.errorCodesOnly == true and
              .outputPolicy.messagesAllowed == false and
              .outputPolicy.responseBodyAllowed == false and
              .outputPolicy.secretValuesAllowed == false
            ' "$DIAGNOSTIC_REQUEST_PATH" >/dev/null

      - name: Perform read-only R2 bucket capability probe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          response_file=$(mktemp)
          comment_file=$(mktemp)
          trap 'rm -f "$response_file" "$comment_file"' EXIT
          chmod 600 "$response_file" "$comment_file"

          http_status=$(curl --silent --show-error \
            --request GET \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$R2_BUCKET_NAME")

          success=$(jq -r 'if .success == true then "true" else "false" end' "$response_file" 2>/dev/null || printf 'false')
          error_codes=$(jq -c 'if (.errors | type) == "array" then (.errors | map(.code)) else [] end' "$response_file" 2>/dev/null || printf '[]')

          bucket_state="unauthorized-or-unknown"
          if [[ "$http_status" == "200" && "$success" == "true" ]]; then
            bucket_state="present"
          elif [[ "$http_status" == "404" ]]; then
            bucket_state="absent"
          fi

          cat >"$comment_file" <<EOF
          ## Cloudflare R2 read-only capability diagnostic

          - source deployment failure: run \`30800918581\`, job \`91645019455\`
          - request method: \`GET\`
          - target resource: approved R2 bucket name only
          - HTTP status: \`$http_status\`
          - Cloudflare success: \`$success\`
          - Cloudflare numeric error codes: \`$error_codes\`
          - derived bucket state: \`$bucket_state\`
          - Cloudflare mutation performed: \`false\`
          - response messages recorded: \`false\`
          - response body recorded: \`false\`
          - secret or account values recorded: \`false\`
          EOF

          gh issue comment 125 --repo "$GITHUB_REPOSITORY" --body-file "$comment_file"
