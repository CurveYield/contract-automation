name: Tier 3 Clean v5 No-Install Verification

on:
  push:
    branches:
      - audit-round5/tier3-controller-ui-v2

permissions:
  contents: read
  issues: write

concurrency:
  group: tier3-clean-v5-no-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Enforce clean candidate boundary
        id: boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -d node_modules
          base=2df81aacb6f5747f06b49297e89e02c3f013d4ef
          git merge-base --is-ancestor "$base" HEAD
          git diff --exit-code "$base" -- apps/web/public apps/api/src/index.mjs
          workflow=.github/workflows/tier3-clean-v5-no-install.yml
          ! grep -Eq '^[[:space:]]+(npm[[:space:]]+(install|ci|test)|pnpm([[:space:]]|$)|yarn([[:space:]]|$)|npx([[:space:]]|$)|forge([[:space:]]|$)|hardhat([[:space:]]|$)|solc([[:space:]]|$)|wrangler([[:space:]]|$))' "$workflow"

      - name: Current compatibility protocol
        id: protocol
        continue-on-error: true
        run: node --test packages/protocol/test/tier3-controller-v3.test.mjs
      - name: Current read adapter
        id: read_adapter
        continue-on-error: true
        run: node --test apps/api/test/controller-adapter-v2.test.mjs
      - name: Current command fencing
        id: command_adapter
        continue-on-error: true
        run: node --test apps/api/test/controller-command-adapter-v2.test.mjs
      - name: Current controller entry
        id: entry
        continue-on-error: true
        run: node --test apps/api/test/controller-entry-v3.test.mjs
      - name: Current browser/detail state
        id: browser
        continue-on-error: true
        run: |
          node --test \
            apps/web/test/tier3-client-v1.test.mjs \
            apps/web/test/controller-view-v3.test.mjs \
            apps/web/test/controller-detail-model-v2.test.mjs \
            apps/web/test/tier3-clean-shell-v3.test.mjs
      - name: Current dual-surface build
        id: build
        continue-on-error: true
        run: node --test packages/runner/test/audit-round5-tier3-clean-build-v3.test.mjs
      - name: Production deployment v4 static contract
        id: deploy_static
        continue-on-error: true
        run: node --test packages/runner/test/audit-round5-tier3-production-deploy-v4.test.mjs
      - name: JavaScript syntax
        id: syntax
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --check packages/protocol/src/tier3-controller-v3.mjs
          node --check apps/api/src/controller-adapter-v2.mjs
          node --check apps/api/src/controller-command-adapter-v2.mjs
          node --check apps/api/src/entry.mjs
          node --check apps/web/src/client.mjs
          node --check apps/web/src/controller-view-v3.mjs
          node --check apps/web/src/controller-detail-model-v2.mjs
          node --check apps/web/tier3/app.js
          node --check scripts/build.mjs
      - name: Enforce verification set
        id: enforce
        shell: bash
        env:
          PROTOCOL: ${{ steps.protocol.outcome }}
          READ_ADAPTER: ${{ steps.read_adapter.outcome }}
          COMMAND_ADAPTER: ${{ steps.command_adapter.outcome }}
          ENTRY: ${{ steps.entry.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          BUILD: ${{ steps.build.outcome }}
          DEPLOY_STATIC: ${{ steps.deploy_static.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
        run: |
          set -euo pipefail
          for outcome in "$PROTOCOL" "$READ_ADAPTER" "$COMMAND_ADAPTER" "$ENTRY" "$BROWSER" "$BUILD" "$DEPLOY_STATIC" "$SYNTAX"; do test "$outcome" = success; done
      - name: Publish sanitized receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOUNDARY: ${{ steps.boundary.outcome }}
          PROTOCOL: ${{ steps.protocol.outcome }}
          READ_ADAPTER: ${{ steps.read_adapter.outcome }}
          COMMAND_ADAPTER: ${{ steps.command_adapter.outcome }}
          ENTRY: ${{ steps.entry.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          BUILD: ${{ steps.build.outcome }}
          DEPLOY_STATIC: ${{ steps.deploy_static.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
          ENFORCE: ${{ steps.enforce.outcome }}
        run: |
          set -euo pipefail
          result=PASS
          [[ "$BOUNDARY" == success && "$ENFORCE" == success ]] || result=FAIL
          receipt=$(cat <<EOF
          ## Tier 3 Clean v5 No-Install Verification

          - result: \`$result\`
          - run: \`$GITHUB_RUN_ID\`
          - source SHA: \`$GITHUB_SHA\`
          - accepted-Lite boundary: \`$BOUNDARY\`
          - current 16.14 protocol: \`$PROTOCOL\`
          - current read adapter: \`$READ_ADAPTER\`
          - Phase-0 command fencing: \`$COMMAND_ADAPTER\`
          - controller entry: \`$ENTRY\`
          - browser/detail: \`$BROWSER\`
          - dual-surface build: \`$BUILD\`
          - production deployment v4 static: \`$DEPLOY_STATIC\`
          - JavaScript syntax: \`$SYNTAX\`
          - dependency installation/download: \`NO\`
          - Cloudflare deployment/controller mutation: \`NO\`
          EOF
          )
          gh issue comment 170 --repo "$GITHUB_REPOSITORY" --body "$receipt"
          gh issue comment 172 --repo "$GITHUB_REPOSITORY" --body "$receipt"
