name: Deploy CurveYield Preflight V4

on:
  push:
    branches:
      - orchestrator/round4-ci-base-v1
    paths:
      - .agent-control/v1/orchestrator/DEPLOY_REQUEST_v4.json

permissions:
  contents: read
  issues: write

concurrency:
  group: curveyield-preflight-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/orchestrator/round4-ci-base-v1' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_BRANCH: orchestrator/round4-ci-base-v1
      DEPLOY_REQUEST_PATH: .agent-control/v1/orchestrator/DEPLOY_REQUEST_v4.json
      DEPLOY_REQUEST_ID: round5-production-ui-scope-deploy-20260803T1100Z-v4
      DEPLOY_EXPECTED_BEFORE_SHA: ec6c5c3c99a767dbed5505846a3ce4efee9290ca
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREFLIGHTSIM_CLIENT_API_KEY: ${{ secrets.PREFLIGHTSIM_CLIENT_API_KEY }}
      PREFLIGHTSIM_GPT_API_KEY: ${{ secrets.PREFLIGHTSIM_GPT_API_KEY }}
      PREFLIGHTSIM_GITHUB_BRIDGE_API_KEY: ${{ secrets.PREFLIGHTSIM_GITHUB_BRIDGE_API_KEY }}
      PREFLIGHTSIM_RUNNER_API_KEY: ${{ secrets.PREFLIGHTSIM_RUNNER_API_KEY }}
      PREFLIGHTSIM_GITHUB_TOKEN: ${{ secrets.PREFLIGHTSIM_GITHUB_TOKEN }}
      PREFLIGHTSIM_R2_ACCESS_KEY_ID: ${{ secrets.PREFLIGHTSIM_R2_ACCESS_KEY_ID }}
      PREFLIGHTSIM_R2_SECRET_ACCESS_KEY: ${{ secrets.PREFLIGHTSIM_R2_SECRET_ACCESS_KEY }}
      RPC_ETHEREUM: ${{ secrets.RPC_ETHEREUM }}
      RPC_BASE: ${{ secrets.RPC_BASE }}
      PREFLIGHTSIM_API_URL: ${{ vars.PREFLIGHTSIM_API_URL }}
      PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
      PREFLIGHTSIM_ALLOWED_GITHUB_USERS: ${{ vars.PREFLIGHTSIM_ALLOWED_GITHUB_USERS }}
      PAGES_DOMAIN: preflight.curveyield.online
      R2_BUCKET_NAME: curveyield-preflight
    steps:
      - name: Check out exact trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Verify one-time deployment request v4
        shell: bash
        env:
          DEPLOY_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test "$DEPLOY_EVENT_BEFORE" = "$DEPLOY_EXPECTED_BEFORE_SHA"
          test -f "$DEPLOY_REQUEST_PATH"
          jq -e \
            --arg request_id "$DEPLOY_REQUEST_ID" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg release_branch "$RELEASE_BRANCH" \
            --arg expected_before "$DEPLOY_EXPECTED_BEFORE_SHA" \
            '
              .schemaVersion == "round5-trusted-deployment-request-v4" and
              .requestId == $request_id and
              .repository == $repository and
              .releaseBranch == $release_branch and
              .expectedBeforeSha == $expected_before and
              .requestedAt == "2026-08-03T11:00:00Z" and
              .requestedBy == "account-owner-through-orchestrator" and
              .activeNetworks == ["ethereum", "base"] and
              .deferredNetworks == ["arbitrum", "fraxtal", "katana", "optimism", "polygon"] and
              .remediation.finding == "production-web-chain-selector-exposed-deferred-networks" and
              .remediation.repair == "static-and-api-synchronized-ethereum-base-only-selector" and
              .remediation.priorSmokeRun == 30807373463 and
              .remediation.priorSmokeInvalidatedByApplicationChange == true and
              .remediation.failedOrHistoricalWorkflowRerun == false and
              .safety.secretValuesIncluded == false and
              .safety.walletSigningAllowed == false and
              .safety.publicTransactionBroadcastAllowed == false and
              .safety.failedOrHistoricalWorkflowRerunAllowed == false
            ' "$DEPLOY_REQUEST_PATH" >/dev/null

      - name: Verify exact source and active configuration names
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/$RELEASE_BRANCH"
          missing=()
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            PREFLIGHTSIM_CLIENT_API_KEY \
            PREFLIGHTSIM_GPT_API_KEY \
            PREFLIGHTSIM_GITHUB_BRIDGE_API_KEY \
            PREFLIGHTSIM_RUNNER_API_KEY \
            PREFLIGHTSIM_GITHUB_TOKEN \
            PREFLIGHTSIM_R2_ACCESS_KEY_ID \
            PREFLIGHTSIM_R2_SECRET_ACCESS_KEY \
            RPC_ETHEREUM \
            RPC_BASE \
            PREFLIGHTSIM_API_URL \
            PAGES_PROJECT_NAME \
            PREFLIGHTSIM_ALLOWED_GITHUB_USERS; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required configuration name: %s\n' "${missing[@]}"
            exit 1
          fi
          test "$PREFLIGHTSIM_API_URL" = "https://api.preflight.curveyield.online"
          test "$PAGES_PROJECT_NAME" = "curveyield-preflight"

      - name: Verify existing R2 bucket without recreating it
        shell: bash
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          status=$(curl --silent --show-error \
            --request GET \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$R2_BUCKET_NAME")
          success=$(jq -r 'if .success == true then "true" else "false" end' "$response_file" 2>/dev/null || printf 'false')
          test "$status" = "200"
          test "$success" = "true"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install pinned trusted dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run unit and security tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run lint

      - name: Build Pages assets
        run: npm run build

      - name: Deploy Worker before adding secrets
        run: npx --no-install wrangler deploy --config apps/api/wrangler.toml

      - name: Upload Worker secrets without logging values
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secrets_file=$(mktemp)
          trap 'rm -f "$secrets_file"' EXIT
          jq -n \
            --arg CLIENT_API_KEY "$PREFLIGHTSIM_CLIENT_API_KEY" \
            --arg GPT_API_KEY "$PREFLIGHTSIM_GPT_API_KEY" \
            --arg GITHUB_BRIDGE_API_KEY "$PREFLIGHTSIM_GITHUB_BRIDGE_API_KEY" \
            --arg RUNNER_API_KEY "$PREFLIGHTSIM_RUNNER_API_KEY" \
            --arg GITHUB_TOKEN "$PREFLIGHTSIM_GITHUB_TOKEN" \
            --arg R2_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID" \
            --arg R2_ACCESS_KEY_ID "$PREFLIGHTSIM_R2_ACCESS_KEY_ID" \
            --arg R2_SECRET_ACCESS_KEY "$PREFLIGHTSIM_R2_SECRET_ACCESS_KEY" \
            --arg ALLOWED_GITHUB_USERS "$PREFLIGHTSIM_ALLOWED_GITHUB_USERS" \
            '{CLIENT_API_KEY:$CLIENT_API_KEY,GPT_API_KEY:$GPT_API_KEY,GITHUB_BRIDGE_API_KEY:$GITHUB_BRIDGE_API_KEY,RUNNER_API_KEY:$RUNNER_API_KEY,GITHUB_TOKEN:$GITHUB_TOKEN,R2_ACCOUNT_ID:$R2_ACCOUNT_ID,R2_ACCESS_KEY_ID:$R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY:$R2_SECRET_ACCESS_KEY,ALLOWED_GITHUB_USERS:$ALLOWED_GITHUB_USERS}' \
            > "$secrets_file"
          npx --no-install wrangler secret bulk "$secrets_file" --config apps/api/wrangler.toml

      - name: Redeploy Worker with API custom domain
        run: npx --no-install wrangler deploy --config apps/api/wrangler.toml

      - name: Verify Worker health with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 10 "$PREFLIGHTSIM_API_URL/api/v1/health" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Deploy Cloudflare Pages from exact trusted source
        run: npx --no-install wrangler pages deploy dist/web --project-name="$PAGES_PROJECT_NAME" --branch="$RELEASE_BRANCH"

      - name: Verify Pages custom domain remains attached
        shell: bash
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          status=$(curl --silent --show-error \
            --request GET \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT_NAME/domains/$PAGES_DOMAIN")
          success=$(jq -r 'if .success == true then "true" else "false" end' "$response_file" 2>/dev/null || printf 'false')
          test "$status" = "200"
          test "$success" = "true"

      - name: Report Production UI scope deployment v4 result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          comment_file=$(mktemp)
          trap 'rm -f "$comment_file"' EXIT
          cat >"$comment_file" <<EOF
          ## Production UI scope deployment v4 result

          - workflow run: \`$GITHUB_RUN_ID\`
          - workflow job status: \`$DEPLOYMENT_JOB_STATUS\`
          - deployed source SHA: \`$GITHUB_SHA\`
          - release branch: \`$RELEASE_BRANCH\`
          - operator chain scope: \`ethereum, base\`
          - prior smoke run superseded: \`30807373463\`
          - failed or historical workflow rerun: \`false\`
          - secret values recorded: \`false\`
          - wallet signing or transaction broadcasting: \`false\`
          EOF
          gh issue comment 125 --repo "$GITHUB_REPOSITORY" --body-file "$comment_file"
