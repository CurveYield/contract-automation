name: Run PreflightSim Job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Authenticated PreflightSim job ID
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: preflightsim-lite-runner
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PREFLIGHTSIM_JOB_ID: ${{ inputs.job_id }}
      PREFLIGHTSIM_API_URL: ${{ vars.PREFLIGHTSIM_API_URL || 'https://preflight.curveyield.online' }}
      PREFLIGHTSIM_RUNNER_API_KEY: ${{ secrets.PREFLIGHTSIM_RUNNER_API_KEY }}
      PREFLIGHTSIM_TIMEOUT_MINUTES: "65"
      RPC_ETHEREUM: ${{ secrets.RPC_ETHEREUM }}
      RPC_BASE: ${{ secrets.RPC_BASE }}
      RPC_KATANA: ${{ secrets.RPC_KATANA }}
      RPC_FRAXTAL: ${{ secrets.RPC_FRAXTAL }}
      RPC_ARBITRUM: ${{ secrets.RPC_ARBITRUM }}
      RPC_POLYGON: ${{ secrets.RPC_POLYGON }}
      RPC_OPTIMISM: ${{ secrets.RPC_OPTIMISM }}
      SIM_ARCHIVE_PRIMARY_ETHEREUM_01: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_01 }}
      SIM_ARCHIVE_PRIMARY_ETHEREUM_02: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_02 }}
      SIM_ARCHIVE_PRIMARY_ETHEREUM_03: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_03 }}
      SIM_ARCHIVE_PRIMARY_ETHEREUM_04: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_04 }}
      SIM_ARCHIVE_PRIMARY_ETHEREUM_05: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_05 }}
      SIM_ARCHIVE_PRIMARY_ETHEREUM_06: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_06 }}
      SIM_ARCHIVE_PRIMARY_ETHEREUM_07: ${{ secrets.SIM_ARCHIVE_PRIMARY_ETHEREUM_07 }}
      SIM_ARCHIVE_SECONDARY_ETHEREUM_01: ${{ secrets.SIM_ARCHIVE_SECONDARY_ETHEREUM_01 }}
      SIM_ARCHIVE_SECONDARY_ETHEREUM_02: ${{ secrets.SIM_ARCHIVE_SECONDARY_ETHEREUM_02 }}
      SIM_ARCHIVE_SECONDARY_ETHEREUM_03: ${{ secrets.SIM_ARCHIVE_SECONDARY_ETHEREUM_03 }}
      SIM_ARCHIVE_PRIMARY_BASE_01: ${{ secrets.SIM_ARCHIVE_PRIMARY_BASE_01 }}
      SIM_ARCHIVE_PRIMARY_BASE_02: ${{ secrets.SIM_ARCHIVE_PRIMARY_BASE_02 }}
      SIM_ARCHIVE_PRIMARY_BASE_03: ${{ secrets.SIM_ARCHIVE_PRIMARY_BASE_03 }}
      SIM_ARCHIVE_PRIMARY_BASE_04: ${{ secrets.SIM_ARCHIVE_PRIMARY_BASE_04 }}
      SIM_ARCHIVE_PRIMARY_BASE_05: ${{ secrets.SIM_ARCHIVE_PRIMARY_BASE_05 }}
      SIM_ARCHIVE_PRIMARY_BASE_06: ${{ secrets.SIM_ARCHIVE_PRIMARY_BASE_06 }}
      SIM_ARCHIVE_PRIMARY_BASE_07: ${{ secrets.SIM_ARCHIVE_PRIMARY_BASE_07 }}
      SIM_ARCHIVE_SECONDARY_BASE_01: ${{ secrets.SIM_ARCHIVE_SECONDARY_BASE_01 }}
      SIM_ARCHIVE_SECONDARY_BASE_02: ${{ secrets.SIM_ARCHIVE_SECONDARY_BASE_02 }}
      SIM_ARCHIVE_SECONDARY_BASE_03: ${{ secrets.SIM_ARCHIVE_SECONDARY_BASE_03 }}
      SIM_ARCHIVE_PRIMARY_KATANA_01: ${{ secrets.SIM_ARCHIVE_PRIMARY_KATANA_01 }}
      SIM_ARCHIVE_PRIMARY_KATANA_02: ${{ secrets.SIM_ARCHIVE_PRIMARY_KATANA_02 }}
      SIM_ARCHIVE_PRIMARY_KATANA_03: ${{ secrets.SIM_ARCHIVE_PRIMARY_KATANA_03 }}
      SIM_ARCHIVE_PRIMARY_KATANA_04: ${{ secrets.SIM_ARCHIVE_PRIMARY_KATANA_04 }}
      SIM_ARCHIVE_PRIMARY_KATANA_05: ${{ secrets.SIM_ARCHIVE_PRIMARY_KATANA_05 }}
      SIM_ARCHIVE_PRIMARY_KATANA_06: ${{ secrets.SIM_ARCHIVE_PRIMARY_KATANA_06 }}
      SIM_ARCHIVE_PRIMARY_KATANA_07: ${{ secrets.SIM_ARCHIVE_PRIMARY_KATANA_07 }}
      SIM_ARCHIVE_SECONDARY_KATANA_01: ${{ secrets.SIM_ARCHIVE_SECONDARY_KATANA_01 }}
      SIM_ARCHIVE_SECONDARY_KATANA_02: ${{ secrets.SIM_ARCHIVE_SECONDARY_KATANA_02 }}
      SIM_ARCHIVE_SECONDARY_KATANA_03: ${{ secrets.SIM_ARCHIVE_SECONDARY_KATANA_03 }}
      SIM_ARCHIVE_PRIMARY_FRAXTAL_01: ${{ secrets.SIM_ARCHIVE_PRIMARY_FRAXTAL_01 }}
      SIM_ARCHIVE_PRIMARY_FRAXTAL_02: ${{ secrets.SIM_ARCHIVE_PRIMARY_FRAXTAL_02 }}
      SIM_ARCHIVE_PRIMARY_FRAXTAL_03: ${{ secrets.SIM_ARCHIVE_PRIMARY_FRAXTAL_03 }}
      SIM_ARCHIVE_PRIMARY_FRAXTAL_04: ${{ secrets.SIM_ARCHIVE_PRIMARY_FRAXTAL_04 }}
      SIM_ARCHIVE_PRIMARY_FRAXTAL_05: ${{ secrets.SIM_ARCHIVE_PRIMARY_FRAXTAL_05 }}
      SIM_ARCHIVE_PRIMARY_FRAXTAL_06: ${{ secrets.SIM_ARCHIVE_PRIMARY_FRAXTAL_06 }}
      SIM_ARCHIVE_PRIMARY_FRAXTAL_07: ${{ secrets.SIM_ARCHIVE_PRIMARY_FRAXTAL_07 }}
      SIM_ARCHIVE_SECONDARY_FRAXTAL_01: ${{ secrets.SIM_ARCHIVE_SECONDARY_FRAXTAL_01 }}
      SIM_ARCHIVE_SECONDARY_FRAXTAL_02: ${{ secrets.SIM_ARCHIVE_SECONDARY_FRAXTAL_02 }}
      SIM_ARCHIVE_SECONDARY_FRAXTAL_03: ${{ secrets.SIM_ARCHIVE_SECONDARY_FRAXTAL_03 }}
      SIM_ARCHIVE_PRIMARY_ARBITRUM_01: ${{ secrets.SIM_ARCHIVE_PRIMARY_ARBITRUM_01 }}
      SIM_ARCHIVE_PRIMARY_ARBITRUM_02: ${{ secrets.SIM_ARCHIVE_PRIMARY_ARBITRUM_02 }}
      SIM_ARCHIVE_PRIMARY_ARBITRUM_03: ${{ secrets.SIM_ARCHIVE_PRIMARY_ARBITRUM_03 }}
      SIM_ARCHIVE_PRIMARY_ARBITRUM_04: ${{ secrets.SIM_ARCHIVE_PRIMARY_ARBITRUM_04 }}
      SIM_ARCHIVE_PRIMARY_ARBITRUM_05: ${{ secrets.SIM_ARCHIVE_PRIMARY_ARBITRUM_05 }}
      SIM_ARCHIVE_PRIMARY_ARBITRUM_06: ${{ secrets.SIM_ARCHIVE_PRIMARY_ARBITRUM_06 }}
      SIM_ARCHIVE_PRIMARY_ARBITRUM_07: ${{ secrets.SIM_ARCHIVE_PRIMARY_ARBITRUM_07 }}
      SIM_ARCHIVE_SECONDARY_ARBITRUM_01: ${{ secrets.SIM_ARCHIVE_SECONDARY_ARBITRUM_01 }}
      SIM_ARCHIVE_SECONDARY_ARBITRUM_02: ${{ secrets.SIM_ARCHIVE_SECONDARY_ARBITRUM_02 }}
      SIM_ARCHIVE_SECONDARY_ARBITRUM_03: ${{ secrets.SIM_ARCHIVE_SECONDARY_ARBITRUM_03 }}
      SIM_ARCHIVE_PRIMARY_POLYGON_01: ${{ secrets.SIM_ARCHIVE_PRIMARY_POLYGON_01 }}
      SIM_ARCHIVE_PRIMARY_POLYGON_02: ${{ secrets.SIM_ARCHIVE_PRIMARY_POLYGON_02 }}
      SIM_ARCHIVE_PRIMARY_POLYGON_03: ${{ secrets.SIM_ARCHIVE_PRIMARY_POLYGON_03 }}
      SIM_ARCHIVE_PRIMARY_POLYGON_04: ${{ secrets.SIM_ARCHIVE_PRIMARY_POLYGON_04 }}
      SIM_ARCHIVE_PRIMARY_POLYGON_05: ${{ secrets.SIM_ARCHIVE_PRIMARY_POLYGON_05 }}
      SIM_ARCHIVE_PRIMARY_POLYGON_06: ${{ secrets.SIM_ARCHIVE_PRIMARY_POLYGON_06 }}
      SIM_ARCHIVE_PRIMARY_POLYGON_07: ${{ secrets.SIM_ARCHIVE_PRIMARY_POLYGON_07 }}
      SIM_ARCHIVE_SECONDARY_POLYGON_01: ${{ secrets.SIM_ARCHIVE_SECONDARY_POLYGON_01 }}
      SIM_ARCHIVE_SECONDARY_POLYGON_02: ${{ secrets.SIM_ARCHIVE_SECONDARY_POLYGON_02 }}
      SIM_ARCHIVE_SECONDARY_POLYGON_03: ${{ secrets.SIM_ARCHIVE_SECONDARY_POLYGON_03 }}
      SIM_ARCHIVE_PRIMARY_OPTIMISM_01: ${{ secrets.SIM_ARCHIVE_PRIMARY_OPTIMISM_01 }}
      SIM_ARCHIVE_PRIMARY_OPTIMISM_02: ${{ secrets.SIM_ARCHIVE_PRIMARY_OPTIMISM_02 }}
      SIM_ARCHIVE_PRIMARY_OPTIMISM_03: ${{ secrets.SIM_ARCHIVE_PRIMARY_OPTIMISM_03 }}
      SIM_ARCHIVE_PRIMARY_OPTIMISM_04: ${{ secrets.SIM_ARCHIVE_PRIMARY_OPTIMISM_04 }}
      SIM_ARCHIVE_PRIMARY_OPTIMISM_05: ${{ secrets.SIM_ARCHIVE_PRIMARY_OPTIMISM_05 }}
      SIM_ARCHIVE_PRIMARY_OPTIMISM_06: ${{ secrets.SIM_ARCHIVE_PRIMARY_OPTIMISM_06 }}
      SIM_ARCHIVE_PRIMARY_OPTIMISM_07: ${{ secrets.SIM_ARCHIVE_PRIMARY_OPTIMISM_07 }}
      SIM_ARCHIVE_SECONDARY_OPTIMISM_01: ${{ secrets.SIM_ARCHIVE_SECONDARY_OPTIMISM_01 }}
      SIM_ARCHIVE_SECONDARY_OPTIMISM_02: ${{ secrets.SIM_ARCHIVE_SECONDARY_OPTIMISM_02 }}
      SIM_ARCHIVE_SECONDARY_OPTIMISM_03: ${{ secrets.SIM_ARCHIVE_SECONDARY_OPTIMISM_03 }}
    steps:
      - name: Check out trusted runner code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install trusted dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund hardhat@3.12.0

      - name: Execute authenticated job
        run: node packages/runner/src/cli.mjs --job-id "$PREFLIGHTSIM_JOB_ID"
