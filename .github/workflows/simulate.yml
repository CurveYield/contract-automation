name: Run PreflightSim Job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Authenticated PreflightSim job ID
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: preflightsim-lite-runner-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  simulate:
    if: ${{ github.ref == 'refs/heads/orchestrator/round4-ci-base-v1' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PREFLIGHTSIM_JOB_ID: ${{ inputs.job_id }}
      PREFLIGHTSIM_API_URL: ${{ vars.PREFLIGHTSIM_API_URL }}
      PREFLIGHTSIM_RUNNER_API_KEY: ${{ secrets.PREFLIGHTSIM_RUNNER_API_KEY }}
      PREFLIGHTSIM_TIMEOUT_MINUTES: "65"
      PREFLIGHTSIM_ALLOWED_CHAINS: "ethereum,base"
      RPC_ETHEREUM: ${{ secrets.RPC_ETHEREUM }}
      RPC_BASE: ${{ secrets.RPC_BASE }}
    steps:
      - name: Check out trusted runner code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Verify trusted source and active configuration names
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          missing=()
          for name in PREFLIGHTSIM_JOB_ID PREFLIGHTSIM_API_URL PREFLIGHTSIM_RUNNER_API_KEY RPC_ETHEREUM RPC_BASE; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required configuration name: %s\n' "${missing[@]}"
            exit 1
          fi
          if [[ "$PREFLIGHTSIM_API_URL" != "https://api.preflight.curveyield.online" ]]; then
            echo "PREFLIGHTSIM_API_URL does not match the approved production API origin"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install trusted dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund hardhat@3.12.0

      - name: Execute authenticated Ethereum or Base job
        run: node packages/runner/src/cli.mjs --job-id "$PREFLIGHTSIM_JOB_ID"
